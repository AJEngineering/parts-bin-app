   Only a passive has a "value". An MCU description reading "64 KB Flash,
   72 MHz" would happily yield 72, so the categories are matched by what they
   are, not by whether the field happens to be empty.                        */
const VALUE_KINDS = [
  {re:/resistor|potentiom|trimpot|rheostat/i, unit:"Ω",
   pick:/(\d+(?:[.,]\d+)?\s*[kKmMrR]?)\s*(?:Ω|ohms?\b)/, alt:/\b(\d+(?:[.,]\d+)?[kKmM])\b/},
  {re:/capacitor|mlcc|tantalum|electrolytic/i, unit:"F",
   pick:/(\d+(?:[.,]\d+)?\s*[pnuµm]?)F\b/i},
  {re:/inductor|choke|coil/i, unit:"H",
   pick:/(\d+(?:[.,]\d+)?\s*[pnuµm]?)H\b/i},
  {re:/ferrite|bead/i, unit:"Ω",
   pick:/(\d+(?:[.,]\d+)?\s*[kKmM]?)\s*Ω\s*@/},
  {re:/zener/i, unit:"V", pick:/(\d+(?:[.,]\d+)?)\s*V\b/},
  {re:/crystal|resonator|oscillator/i, unit:"Hz",
   pick:/(\d+(?:[.,]\d+)?\s*[kKmM]?)Hz\b/i}
];
function valueKindFor(p){
  const hay = (p.cat||"")+" "+(p.desc||"");
  return VALUE_KINDS.find(k=>k.re.test(hay)) || null;
}
/* what the description says this part is worth, or "" when it does not say */
function guessValue(p){
  const kind = valueKindFor(p);
  if(!kind) return "";
  const src = (p.desc||"") + " " + (p.mpn||"");
  let m = kind.pick.exec(src);
  if(!m && kind.alt) m = kind.alt.exec(src);
  if(!m) return "";
  const raw = m[1].replace(/\s+/g,"").replace(",",".");
  const txt = raw + (kind.unit==="Ω" ? "Ω" : kind.unit);
  /* refuse anything the normaliser cannot read back */
  const n = parseFloat(normValue(txt));
  if(!isFinite(n) || n<=0) return "";
  return txt;
}
function guessValueList(){
  return db.parts.filter(p=>!String(p.val||"").trim())
                 .map(p=>({p, val:guessValue(p)}))
                 .filter(x=>x.val);
}

/* ------------------------------------------------------------ LCSC lookup --
   LCSC answers a part code with the maker, the package, every parameter and a
   datasheet, as plain JSON. What it does not answer with is an
   Access-Control-Allow-Origin header, and without that header no browser will
   hand the reply to a page living at a different address. Nothing written here
   can change that - the request has to be repeated by a relay that does send
   the header. Set your own under Data; the public ones are a fallback only,
   they are run by strangers as a favour and any of them may be down today.  */
/* how this page is being used, not what is in the bin - so it stays in the
   browser and never travels into the inventory file                        */
const PREF_KEY = "parts-bin-prefs-v1";
/* how a BOM line is allowed to find its part - see matchBom */
const prefs = {bomMatch:"value"};
function prefsLoad(){ try{ const t=localStorage.getItem(PREF_KEY); if(t) Object.assign(prefs, JSON.parse(t)); }catch(e){} }
function prefsSave(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }catch(e){} }

const LCSC_KEY = "parts-bin-lcsc-v1";
const LCSC_API = "https://wmsc.lcsc.com/ftps/wm/product/detail?productCode=";
/* Named so a failure can say which one failed. Ordered by what actually
   answered when this was last checked - the first is a reader service that
   sends the header properly and wraps the page in an envelope, the other two
   hand the page back untouched and are up rather less of the time.         */
/* The third flag marks a relay that runs the page's JavaScript before
   answering. It makes no difference to the part endpoint, which is plain
   JSON, but the search page is built in the browser: a relay that only
   forwards bytes hands back an empty shell with no results in it.         */
const LCSC_PUBLIC = [["reader", "https://r.jina.ai/", true],
                     ["codetabs", "https://api.codetabs.com/v1/proxy?quest={url}", false],
                     ["allorigins", "https://api.allorigins.win/raw?url={url}", false]];
let lcscVia = "";           /* which route answered last, for the Data panel */
/* The hosted demo carries a relay of its own, because a first visit that
   fails is a first visit lost - and the free public ones hand back a
   truncated page often enough to lose several. It applies to that one
   address and nowhere else: a copy downloaded and opened, or a fork hosted
   somewhere else, uses the public relays like everybody, because nobody's
   lookups should quietly run through an account that is not theirs. Setting
   your own under Data overrides it either way.                            */
const DEMO_HOST  = "ajengineering.github.io";
const DEMO_RELAY = "https://lcsc-relay.abdullah-md-jalloul.workers.dev/?url={url}";
const onDemo   = () => location.hostname === DEMO_HOST;
const demoRelay = () => (onDemo() && !lcsc.relay) ? DEMO_RELAY : "";

const lcsc = {relay:"", auto:true, public:true};
function lcscLoad(){ try{ const t=localStorage.getItem(LCSC_KEY); if(t) Object.assign(lcsc, JSON.parse(t)); }catch(e){} }
function lcscSave(){ try{ localStorage.setItem(LCSC_KEY, JSON.stringify(lcsc)); }catch(e){} }

/* C1779, c1779, plain 1779, or the code lifted out of a pasted lcsc.com link.
   The C has to start a word, or "CL21A475KAQNNNE" pasted into the wrong box
   would quietly become some other real part.                                */
function lcscCode(raw){
  const s = String(raw||"").toUpperCase().trim();
  const m = s.match(/(?:^|[^A-Z0-9])C(\d{2,})(?![0-9])/);
  if(m) return "C"+m[1];
  return /^\d{2,}$/.test(s) ? "C"+s : "";
}
function lcscPage(code){ return "https://www.lcsc.com/search?q="+encodeURIComponent(code); }

/* A relay is either a template carrying {url}, or a bare prefix. A prefix that
   ends in = or ? is handed the address encoded, anything else is handed it
   whole - both shapes are in the wild and neither can be guessed from the
   other.                                                                    */
function lcscRoute(tpl, target){
  if(!tpl) return target;
  if(tpl.indexOf("{url}")>=0) return tpl.replace("{url}", encodeURIComponent(target));
  return /[=?]$/.test(tpl) ? tpl + encodeURIComponent(target) : tpl + target;
}

/* Not every relay hands the page back untouched. A reader service wraps it in
   an envelope of its own and puts the page in a string; another prints a few
   header lines before it. Dig until something with a productCode in it turns
   up, and give up after a few layers rather than chase a loop.             */
function lcscUnwrap(text, depth){
  if((depth||0) > 3) throw new Error("the reply was not a part");
  let d = null;
  try{ d = JSON.parse(text); }catch(e){}
  if(d && typeof d==="object"){
    /* LCSC's own answer, whether it found the part or not */
    if(d.result !== undefined) return d;
    const inner = (d.data && typeof d.data.content==="string") ? d.data.content
                : (typeof d.contents==="string") ? d.contents
                : (typeof d.content==="string") ? d.content : "";
    if(inner) return lcscUnwrap(inner, (depth||0)+1);
    return d;
  }
  /* not JSON at the top: a relay may have printed a preamble first */
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if(a>=0 && b>a) return lcscUnwrap(text.slice(a, b+1), (depth||0)+1);
  throw new Error("the reply was not JSON");
}

async function lcscOne(tpl, code, ms){
  const ctl = new AbortController();
  /* a relay that is alive answers in about a second; one that has not spoken
     in eight is down, and waiting longer only delays trying the next        */
  const timer = setTimeout(()=>ctl.abort(), ms||8000);
  try{
    const r = await fetch(lcscRoute(tpl, LCSC_API+code), {signal:ctl.signal, headers:{Accept:"application/json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return lcscUnwrap(await r.text(), 0);
  } finally { clearTimeout(timer); }
}

/* Straight at LCSC first - it costs one failed request and it is the only
   route that works when this page is already served from behind something
   that relays for it. Then yours, then the public ones. A reply saying the
   code does not exist is a real answer and stops the walk; a route that
   simply could not be reached does not.                                     */
async function lcscFetch(code){
  const routes = [["direct",""]]
    .concat(lcsc.relay?[["your relay", lcsc.relay]]:[])
    .concat(demoRelay()?[["the demo relay", demoRelay()]]:[])
    .concat(lcsc.public?LCSC_PUBLIC:[]);
  const failed = [];
  lcscVia = "";
  for(const [name,tpl] of routes){
    let d;
    try{ d = await lcscOne(tpl, code); }
    catch(e){
      failed.push(name+" "+(e.name==="AbortError" ? "timed out"
                          : /failed to fetch|networkerror|load failed/i.test(e.message) ? "could not be reached"
                          : e.message));
      continue;
    }
    if(d && d.result && d.result.productCode){ lcscVia = name; return d.result; }
    /* a real answer from LCSC saying the code is not one of theirs - no other
       route is going to say anything different, so stop here                */
    if(d && (d.code===404 || d.result===null)) throw new Error("LCSC has no part called "+code);
    failed.push(name+" answered, but not with a part");
  }
  throw new Error(failed.length ? "no route worked — "+failed.join("; ")
                                : "there is nothing to try: no relay of your own, and the public ones are switched off");
}

/* Only a passive carries a value, and the order of the pieces is this bin's
   own: a capacitor reads "25V 4.7uF X5R ±10%", not LCSC's own running order.
   Anything else - an MCU, a regulator, a MOSFET - is left with no value at
   all, exactly as the rest of the app already treats it.                    */
const LCSC_VALUE = [
  {re:/resistor/i,                     keys:[/^resistance/i]},
  {re:/capacitor/i,                    keys:[/^voltage rating/i,/^capacitance/i,/^temperature coefficient/i,/^tolerance/i]},
  {re:/inductor|choke|coil/i,          keys:[/^current rating/i,/^inductance/i,/^tolerance/i,/^dc resistance/i]},
  {re:/ferrite|bead/i,                 keys:[/impedance/i]},
  {re:/zener/i,                        keys:[/zener.*volt|volt.*zener|breakdown/i]},
  {re:/crystal|resonator|oscillator/i, keys:[/^frequency$/i]}
];
function lcscParam(r, re){
  const list = Array.isArray(r.paramVOList) ? r.paramVOList : [];
  const hit = list.find(p=>re.test(String(p.paramNameEn||"")));
  if(!hit) return "";
  const v = String(hit.paramValueEn || hit.paramValue || "").trim();
  /* LCSC leaves a few values untranslated, and Chinese on a bin label helps
     nobody here - drop those rather than write them in                      */
  return /[一-鿿]/.test(v) ? "" : v;
}
function lcscValue(r){
  const hay = (r.catalogName||"")+" "+(r.parentCatalogName||"");
  const fam = LCSC_VALUE.find(f=>f.re.test(hay));
  if(!fam) return "";
  return fam.keys.map(k=>lcscParam(r,k)).filter(Boolean).join(" ");
}

/* LCSC's catalogue tree is not this bin's shelf, so a name is only ever
   matched onto a category that already exists here. A category is never
   invented from a lookup - that is the one thing the person filling the form
   is better at than any table.                                              */
const LCSC_CATS = [
  [/microcontroller/i,                "MCU"],
  [/capacitor/i,                      "Capacitors"],
  [/resistor/i,                       "Resistors"],
  [/potentiometer|trimmer|rheostat/i, "Potentiometers"],
  [/ferrite bead/i,                   "Ferrite-Beads"],
  [/inductor|choke/i,                 "Inductors"],
  [/zener/i,                          "Zener"],
  [/\btvs\b|\besd\b|transient volt/i, "TVS ESD"],
  [/light emitting|\bled\b/i,         "LED"],
  [/bridge rectifier|rectifier/i,     "Rectifiers"],
  [/schottky|switching diode|diode/i, "Diodes"],
  [/crystal|resonator/i,              "Crystals"],
  [/optocoupler|opto-isolator|photocoupler/i, "Optocouplers"],
  [/gate driver/i,                    "MOSFET Gate Drive"],
  [/motor driver/i,                   "Motor Driver ICs"],
  [/\bldo\b|low dropout/i,            "LDO"],
  [/voltage reference/i,              "Voltage References"],
  [/comparator/i,                     "Comparators"],
  [/operational amplifier|\bop.?amp/i,"Op-Amp"],
  [/analog switch|multiplexer/i,      "Analog Switches"],
  [/varistor/i,                       "Varistors"],
  [/\bfuse\b|resettable/i,            "Fuses"],
  [/relay/i,                          "Relays"],
  [/buzzer/i,                         "Buzzer"],
  [/transformer/i,                    "Transformer"],
  [/battery holder/i,                 "BATTERY HOLDER"],
  [/\busb\b/i,                        "USB"],
  [/\bcan\b/i,                        "CAN-IC"],
  [/terminal|header|connector/i,      "Terminal"],
  [/switch|tactile/i,                 "Switches"],
  [/sensor/i,                         "Sensors"]
];
function lcscCategory(r){
  const hay = [r.catalogName, r.parentCatalogName, r.productIntroEn].filter(Boolean).join(" ");
  const has = n => db.categories.find(c=>c.trim().toLowerCase()===n.toLowerCase()) || "";
  /* the channel and the polarity are in the description, never in the tree */
  if(/mosfet|field.effect|\bfet\b/i.test(hay)){
    if(/p-?channel/i.test(hay)) return has("MOSFET P-CH");
    if(/n-?channel/i.test(hay)) return has("MOSFET N-CH");
  }
  if(/\bnpn\b/i.test(hay)) return has("BJT NPN");
  if(/\bpnp\b/i.test(hay)) return has("BJT PNP");
  for(const [re,name] of LCSC_CATS){ if(re.test(hay)){ const c = has(name); if(c) return c; } }
  /* nothing named outright: fall back to whichever shelf shares the most
     words, and to none at all when it shares nothing                        */
  const words = new Set((hay.toLowerCase().match(/[a-z]{4,}/g)||[]).map(w=>w.replace(/s$/,"")));
  let best = "", score = 0;
  for(const c of db.categories){
    let n = 0;
    for(const w of (c.toLowerCase().match(/[a-z]{4,}/g)||[])) if(words.has(w.replace(/s$/,""))) n++;
    if(n>score){ score = n; best = c; }
  }
  return score ? best : "";
}

function lcscMap(r){
  return {mpn:  String(r.productModel||"").trim(),
          mfr:  String(r.brandNameEn||"").trim(),
          pkg:  String(r.encapStandard||"").trim(),
          val:  lcscValue(r),
          desc: String(r.productIntroEn||r.productDescEn||"").trim().replace(/\s+RoHS$/i,""),
          cat:  lcscCategory(r),
          /* the datasheet arrives with every lookup and used to be shown once
             and thrown away; keeping it is the whole cost of the feature   */
          ds:   String(r.pdfUrl||"").trim(),
          /* the smallest-break price, as text so it fills a form field like the rest */
          price: lcscUnitPrice(r),
          src:  "LCSC"};
}
/* ----------------------------------------------------------- part pictures --
   A link to LCSC's photo would die the day they re-shoot the part, and LCSC's
   photos are 900x900 with the part lost in a sea of white. So the picture is
   fetched once, cut down to the part itself, centred in one fixed square and
   kept as a file of its own:
     - in this browser (IndexedDB), so it shows at once and offline;
     - in the repository, next to the inventory file, as images/C1779.webp,
       so every other machine finds it there - pushed as one commit per batch.
   The part only carries the path, never the picture.                       */
const IMG_SIZE = 256;            /* the square every picture is drawn into  */
const IMG_FILL = 0.88;           /* the part fills this much of it          */
const IMG_DIR  = "images/";
const imgUrls  = new Map();      /* path -> object URL, so a redraw is free */
const imgWait  = new Map();      /* path -> the lookup already under way    */
const imgMiss  = new Set();      /* not found anywhere, this session        */
let imgUnpushed = new Set();     /* saved here, not yet in the repository   */
const imgIsUrl = v => /^(https?:|data:|blob:)/i.test(String(v||""));

/* LCSC sends the photos as a list, largest first, and on older parts as one
   or two single fields. Whichever is there is taken, as https.            */
function lcscImage(r){
  const list = Array.isArray(r.productImages) ? r.productImages : [];
  const u = String(list[0] || r.productImageUrlBig || r.productImageUrl || "").trim();
  return u.replace(/^\/\//,"https://").replace(/^http:/,"https:");
}

/* The bytes have to be readable, not just shown - a picture drawn from
   another address without CORS taints the canvas and cannot be saved. So
   the same walk as the part lookup: straight at LCSC, then the relays. The
   reader relay is skipped: it hands back a description of the picture, not
   the picture. A reply only counts if it decodes as an image.            */
async function imgDownload(url){
  const routes = [["direct",""]]
    .concat(lcsc.relay?[["your relay", lcsc.relay]]:[])
    .concat(demoRelay()?[["the demo relay", demoRelay()]]:[])
    .concat(lcsc.public?LCSC_PUBLIC.filter(r=>!r[2]):[]);
  const failed = [];
  for(const [name,tpl] of routes){
    const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 15000);
    try{
      const r = await fetch(lcscRoute(tpl, url), {signal:ctl.signal});
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await createImageBitmap(await r.blob());
    }catch(e){
      failed.push(name+" "+(e.name==="AbortError" ? "timed out"
                          : /failed to fetch|networkerror|load failed/i.test(e.message) ? "could not be reached"
                          : e.name==="InvalidStateError" || /decode|source image/i.test(e.message) ? "did not send a picture"
                          : e.message));
    }finally{ clearTimeout(timer); }
  }
  throw new Error("the picture could not be fetched — "+failed.join("; "));
}

/* Find the part inside the white margin, then draw it centred in the
   square at the same fill every time - so a 0402 and a TO-220 both sit at
   the same size on screen, rather than one lost in its photo.             */
async function imgSquare(bmp){
  const W = bmp.width, H = bmp.height;
  const k = Math.min(1, 400/Math.max(W,H));          /* scan a small copy */
  const sw = Math.max(1,Math.round(W*k)), sh = Math.max(1,Math.round(H*k));
  const sc = document.createElement("canvas"); sc.width = sw; sc.height = sh;
  const sx = sc.getContext("2d", {willReadFrequently:true});
  sx.fillStyle = "#fff"; sx.fillRect(0,0,sw,sh); sx.drawImage(bmp,0,0,sw,sh);
  const px = sx.getImageData(0,0,sw,sh).data;
  let x0 = sw, y0 = sh, x1 = -1, y1 = -1;
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++){
    const i = (y*sw+x)*4;
    if(px[i]<236 || px[i+1]<236 || px[i+2]<236){
      if(x<x0) x0=x; if(x>x1) x1=x; if(y<y0) y0=y; if(y>y1) y1=y;
    }
  }
  /* an all-white photo: keep the whole frame rather than nothing */
  if(x1<0){ x0=0; y0=0; x1=sw-1; y1=sh-1; }
  const cx = x0/k, cy = y0/k, cw = (x1-x0+1)/k, ch = (y1-y0+1)/k;
  const out = document.createElement("canvas"); out.width = out.height = IMG_SIZE;
  const o = out.getContext("2d");
  o.fillStyle = "#fff"; o.fillRect(0,0,IMG_SIZE,IMG_SIZE);
  o.imageSmoothingQuality = "high";
  const f = IMG_SIZE*IMG_FILL/Math.max(cw,ch);
  const dw = cw*f, dh = ch*f;
  o.drawImage(bmp, cx,cy,cw,ch, (IMG_SIZE-dw)/2,(IMG_SIZE-dh)/2, dw,dh);
  const enc = (type,q) => new Promise(res=>out.toBlob(res, type, q));
  /* Safari will not write WebP and quietly hands back a PNG - JPEG then,
     which is a quarter of the size of that PNG on a white ground         */
  let b = await enc("image/webp", 0.85);
  if(!b || b.type!=="image/webp") b = await enc("image/jpeg", 0.88);
  return b;
}

async function imgKeep(path, blob, unpushed){
  await idbSet("img:"+path, blob);
  if(imgUrls.has(path)) URL.revokeObjectURL(imgUrls.get(path));
  imgUrls.set(path, URL.createObjectURL(blob));
  imgMiss.delete(path);
  if(unpushed){ imgUnpushed.add(path); await idbSet("img:unpushed", [...imgUnpushed]); }
}

/* LCSC code + photo address in, the path of the saved square out */
async function imgSave(code, url){
  const blob = await imgSquare(await imgDownload(url));
  const path = IMG_DIR + code + (blob.type==="image/webp" ? ".webp" : ".jpg");
  await imgKeep(path, blob, true);
  return path;
}

/* --- the repository side. The contents API is one commit per file, which
   for a whole bin is hundreds of commits; the git data API writes them all
   as one. The inventory file is not touched, so its own sha stays valid. */
function ghDir(){ const i = gh.path.lastIndexOf("/"); return i<0 ? "" : gh.path.slice(0,i+1); }
function ghGit(){ return "https://api.github.com/repos/"+gh.repo+"/git/"; }
function ghRef(){ return "heads/"+gh.branch.split("/").map(encodeURIComponent).join("/"); }
async function blobB64(blob){
  const b = new Uint8Array(await blob.arrayBuffer());
  let s = "";
  for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i,i+0x8000));
  return btoa(s);
}
async function ghJson(url, method, body){
  const r = await fetch(url, {method:method||"GET", cache:"no-store",
    headers:Object.assign({"Content-Type":"application/json"}, ghHead()),
    body: body ? JSON.stringify(body) : undefined});
  if(!r.ok){ const e = new Error(await ghErr(r)); e.status = r.status; throw e; }
  return r.json();
}

/* Push every picture still waiting. Another machine pushing in between
   makes the ref update fail as not a fast-forward - the blobs are already
   up, so it is only the tree and the commit that are made again.          */
async function imgPush(){
  if(!ghReady() || !imgUnpushed.size) return 0;
  const paths = [...imgUnpushed];
  const tree = [];
  for(const path of paths){
    const blob = await idbGet("img:"+path);
    if(!blob){ imgUnpushed.delete(path); continue; }
    const b = await ghJson(ghGit()+"blobs", "POST", {content: await blobB64(blob), encoding:"base64"});
    tree.push({path: ghDir()+path, mode:"100644", type:"blob", sha:b.sha});
  }
  if(tree.length){
    for(let attempt=0;;attempt++){
      const head = await ghJson(ghGit()+"ref/"+ghRef());
      const base = await ghJson(ghGit()+"commits/"+head.object.sha);
      const t = await ghJson(ghGit()+"trees", "POST", {base_tree: base.tree.sha, tree});
      const c = await ghJson(ghGit()+"commits", "POST",
        {message:"images · "+tree.length+" part picture"+(tree.length>1?"s":""), tree:t.sha, parents:[head.object.sha]});
      try{ await ghJson(ghGit()+"refs/"+ghRef(), "PATCH", {sha:c.sha}); break; }
      catch(e){ if(e.status!==422 || attempt>=2) throw e; }
    }
  }
  paths.forEach(p=>imgUnpushed.delete(p));
  await idbSet("img:unpushed", [...imgUnpushed]);
  return tree.length;
}

/* A path this browser has never seen is read from the repository once and
   kept; four at a time, so opening a bin of 400 parts on a new machine
   does not fire 400 requests in the same instant.                         */
let imgSlots = 4; const imgQueue = [];
function imgLimit(fn){
  return new Promise((res,rej)=>{
    const go = ()=>{ imgSlots--; fn().then(res,rej).finally(()=>{ imgSlots++; const n = imgQueue.shift(); if(n) n(); }); };
    imgSlots>0 ? go() : imgQueue.push(go);
  });
}
async function ghGetImage(path){
  const r = await fetch("https://api.github.com/repos/"+gh.repo+"/contents/"+
      (ghDir()+path).split("/").map(encodeURIComponent).join("/")+"?ref="+encodeURIComponent(gh.branch),
    {headers:Object.assign({}, ghHead(), {Accept:"application/vnd.github.raw"})});
  return r.ok ? r.blob() : null;
}
function imgResolve(path){
  if(imgUrls.has(path)) return Promise.resolve(imgUrls.get(path));
  if(imgMiss.has(path)) return Promise.resolve("");
  if(!imgWait.has(path)) imgWait.set(path, (async()=>{
    let blob = await idbGet("img:"+path);
    if(!blob && ghReady()){
      blob = await imgLimit(()=>ghGetImage(path)).catch(()=>null);
      if(blob) await idbSet("img:"+path, blob);
    }
    imgWait.delete(path);
    if(!blob){ imgMiss.add(path); return ""; }
    const u = URL.createObjectURL(blob); imgUrls.set(path, u); return u;
  })());
  return imgWait.get(path);
}
function imgDead(el){
  const t = el.parentNode;
  if(t && t.classList.contains("thumb")){ t.classList.add("none"); t.textContent = el.dataset.pkg||""; }
  else el.hidden = true;
}
/* run after every redraw: a saved picture has no address until it is
   looked up, so the row is drawn first and the picture put in after      */
function imgHydrate(root){
  for(const el of $$("img[data-img]", root||document)){
    imgResolve(el.dataset.img).then(u=>{ if(u) el.src = u; else imgDead(el); });
  }
}
async function imgBoot(){
  const u = await idbGet("img:unpushed");
  if(Array.isArray(u)) imgUnpushed = new Set(u);
}

/* --- many at once: every part with an LCSC code and no picture. Each one
   is written onto its part as it lands, and the repository gets the lot in
   one commit at the end - or at Stop, so nothing fetched is lost.        */
let imgBulkStop = false;
function imgGapList(){ return db.parts.filter(p=>lcscCode(p.lcsc) && !String(p.img||"").trim()); }
async function imgBulkRun(){
  const list = imgGapList(), w = () => $("#imgBulkWork");
  imgBulkStop = false;
  const failed = []; let done = 0, got = 0;
  for(const p of list){
    if(imgBulkStop) break;
    if(w()) w().innerHTML = `<div class="lcscnote" style="margin-top:10px">Fetching <b>${done+1}</b> of ${list.length}
        · ${got} saved${failed.length?` · <span class="bad">${failed.length} failed</span>`:""}…</div>
      <div class="sheetbar"><button class="btn ghost" id="imgBulkHalt">Stop</button></div>`;
    try{
      const code = lcscCode(p.lcsc);
      const src = lcscImage(await lcscFetch(code));
      if(!src) throw new Error("LCSC has no picture of it");
      p.img = await imgSave(code, src); got++;
    }catch(e){ failed.push({p, why:e.message}); }
    done++;
    if(done < list.length && !imgBulkStop) await new Promise(r=>setTimeout(r,250));
  }
  if(got){ logAdd({k:"edit", mpn:"("+got+" parts)", cat:"pictures from LCSC"}); save(); }
  let pushed = "";
  if(got && ghReady()){
    if(w()) w().innerHTML = `<div class="lcscnote" style="margin-top:10px">Pushing ${imgUnpushed.size} pictures to ${esc(gh.repo)}…</div>`;
    try{ pushed = ` · ${await imgPush()} pushed to ${esc(gh.repo)}`; }
    catch(e){ pushed = ` · <span class="bad">push failed: ${esc(e.message)}</span> — they are kept here and go with the next push`; }
  }
  render();
  if(w()) w().innerHTML = `<div class="lcscnote" style="margin-top:10px">Fetched ${done} of ${list.length}${
      imgBulkStop?" before stopping":""} · <b>${got} saved</b>${pushed}${
      failed.length?`<br><span class="bad">${failed.length} without a picture:</span> ${
        failed.slice(0,12).map(f=>esc(f.p.lcsc)+" ("+esc(f.why)+")").join(", ")}${failed.length>12?" …":""}`:""}</div>`;
}

/* -------------------------------------------- filling many parts at once --
   Every part that carries an LCSC code but has a field left blank can be read
   in one pass. The rule is the one the single lookup uses - a blank is filled,
   anything already written is never touched - and it runs in two steps like
   the other bulk actions here: read first, see what it proposes, then apply.

   A part with no value is not on its own a reason to go back to LCSC: an MCU
   or a MOSFET has no value and never will, so asking again every time would
   burn a request per part forever. Only the fields LCSC always answers with
   decide whether a part is worth asking about.                              */
const LCSC_GAP_KEYS  = ["mpn","mfr","pkg","desc","cat","ds","price"];
const LCSC_FILL_KEYS = ["mpn","mfr","pkg","val","desc","cat","src","ds","price"];
function lcscGapList(){
  return db.parts.filter(p => lcscCode(p.lcsc) &&
    LCSC_GAP_KEYS.some(k => !String(p[k]||"").trim()));
}
let lcscBulkStop = false;

async function lcscBulkRead(){
  const list = lcscGapList();
  lcscBulkStop = false;
  ui.lcscBulk = null;
  const rows = [], failed = [];
  let done = 0;
  for(const p of list){
    if(lcscBulkStop) break;
    lcscBulkProgress(done, list.length, failed.length);
    try{
      const got = lcscMap(await lcscFetch(lcscCode(p.lcsc)));
      const fills = {};
      for(const k of LCSC_FILL_KEYS){
        const v = got[k];
        if(!v || String(p[k]||"").trim()) continue;
        /* a shelf is never invented for a part behind the person's back */
        if(k==="cat" && !db.categories.includes(v)) continue;
        fills[k] = v;
      }
      if(Object.keys(fills).length) rows.push({p, fills});
    }catch(e){ failed.push({p, why:e.message}); }
    done++;
    /* a free relay is doing this as a favour - do not hammer it */
    if(done < list.length && !lcscBulkStop) await new Promise(r=>setTimeout(r,250));
  }
  ui.lcscBulk = {rows, failed, done, total:list.length, stopped:lcscBulkStop};
  lcscBulkShow();
}

function lcscBulkProgress(done, total, failed){
  const w = $("#lcscBulkWork");
  if(!w) return;                       /* the view was left mid-run */
  w.innerHTML = `<div class="lcscnote" style="margin-top:10px">
      Reading <b>${done+1}</b> of ${total}${failed?` · ${failed} could not be read`:""}…
    </div>
    <div class="sheetbar"><button class="btn ghost" id="lcscBulkHalt">Stop</button></div>`;
}

function lcscBulkShow(){
  const b = ui.lcscBulk, w = $("#lcscBulkWork");
  if(!w || !b) return;
  if(!b.rows.length){
    w.innerHTML = `<div class="lcscnote" style="margin-top:10px">Read ${b.done} of ${b.total}${
      b.stopped?" before stopping":""} — nothing new came back${
      b.failed.length?`, and ${b.failed.length} could not be read`:""}.</div>
      <div class="sheetbar"><button class="btn ghost" id="lcscBulkCancel">Close</button></div>`;
    return;
  }
  const fieldName = {mpn:"part number", mfr:"manufacturer", pkg:"package", val:"value",
                     desc:"description", cat:"category", src:"supplier", ds:"datasheet", price:"price $"};
  w.innerHTML = `<table style="margin-top:12px"><thead><tr><th>LCSC</th><th>Part</th>
      <th>Would fill</th></tr></thead><tbody>
      ${b.rows.slice(0,60).map(r=>`<tr>
        <td class="m">${esc(r.p.lcsc)}</td>
        <td class="m">${esc(r.p.mpn||r.p.val||"—")}</td>
        <td style="font-size:11.5px">${Object.keys(r.fills).map(k=>
          `<span style="color:var(--ink3)">${esc(fieldName[k]||k)}</span>
           <b style="color:var(--kapton)">${esc(String(r.fills[k]).slice(0,42))}</b>`).join(" · ")}</td></tr>`).join("")}

function lcscNoCodeList(){ return db.parts.filter(p=>!lcscCode(p.lcsc) && String(p.mpn||"").trim().length>=4); }
let lcscFindStop = false;
async function lcscFindBulk(){
  const list = lcscNoCodeList();
  lcscFindStop = false; ui.findBulk = null;
  const rows = [], miss = [];
  let done = 0;
  for(const p of list){
    if(lcscFindStop) break;
    const w = $("#lcscFindWork");
    if(w) w.innerHTML = `<div class="lcscnote" style="margin-top:10px">Searching <b>${done+1}</b> of ${list.length}
        · ${rows.length} found${miss.length?` · ${miss.length} not found`:""}…</div>
      <div class="sheetbar"><button class="btn ghost" id="lcscFindHalt">Stop</button></div>`;
    try{
      const hits = await lcscFind(p.mpn);
      const hit = hits.find(h=>h.exact);
      if(!hit || db.parts.some(x=>x!==p && lcscCode(x.lcsc)===hit.code)) miss.push(p);
      else {
        const got = lcscMap(hit.r), fills = {lcsc: hit.code};
        for(const k of LCSC_FILL_KEYS){
          if(k==="src" || k==="mpn") continue;
          const v = got[k];
          if(!v || String(p[k]==null?"":p[k]).trim()) continue;
          if(k==="cat" && !db.categories.includes(v)) continue;
          fills[k] = v;
        }
        rows.push({p, fills});
      }
    }catch(e){ miss.push(p); }
    done++;
    if(done < list.length && !lcscFindStop) await new Promise(r=>setTimeout(r,400));
  }
  ui.findBulk = {rows, miss, done, total:list.length, stopped:lcscFindStop};
  lcscFindShow();
}
function lcscFindShow(){
  const b = ui.findBulk, w = $("#lcscFindWork");

      b.miss.length?` · ${b.miss.length} not on LCSC under that exact number`:""}.`;
  if(!b.rows.length){
    w.innerHTML = `<div class="lcscnote" style="margin-top:10px">${tail}</div>

/* ------------------------------------------ finding a code from a part no -
   Plenty of parts were entered with only a manufacturer part number. LCSC's
   own search API sits behind a bot filter and answers 403 to anything that is
   not their website, but the reader relay renders the search page, and the
   codes are in the product-detail links on it.

   That is a guess and must be treated as one. LCSC answers a part number it
   does not carry with near neighbours, or with the whole category - searching
   0603SAF8204T5E returns 0603WAF8204T5E, which is a different tolerance and
   the wrong part to write into a bin. So every candidate is looked up
   properly through the detail endpoint and its real part number compared with
   the one asked for. Nothing is ever filled in from the guess alone.       */
const LCSC_SEARCH = "https://www.lcsc.com/search?q=";
const mpnKey = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");

/* the same walk as lcscFetch, but for any address, and it hands back text.
   `routes` is passed in because the search needs the rendering relays only -
   going straight at LCSC returns the page's empty shell, and returns it fast,
   which would look like success and find nothing.                          */
async function lcscTextFrom(url, ms, routes){
  routes = routes || [["direct",""]]
    .concat(lcsc.relay?[["your relay", lcsc.relay]]:[])
    .concat(demoRelay()?[["the demo relay", demoRelay()]]:[])
    .concat(lcsc.public?LCSC_PUBLIC:[]);
  const failed = [];
  for(const [name,tpl] of routes){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), ms||25000);
    try{
      const r = await fetch(lcscRoute(tpl, url), {signal:ctl.signal, headers:{Accept:"application/json"}});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const body = await r.text();
      /* a reader relay wraps the page; anything else hands it over as it is */
      let d = null; try{ d = JSON.parse(body); }catch(e){}
      if(d && d.data && typeof d.data.content==="string") return d.data.content;
      if(d && typeof d.contents==="string") return d.contents;
      return body;
    }catch(e){
      failed.push(name+" "+(e.name==="AbortError" ? "timed out" : e.message));
    } finally { clearTimeout(timer); }
  }
  throw new Error("no route worked — "+failed.join("; "));
}

/* JLCPCB search the same catalogue and answer in structured JSON. LCSC have
   no such endpoint open to anyone else - theirs is behind a bot filter - so
   the only way in is to render their search page and read the links off it,
   and a page assembled in the browser is a poor thing to scrape: the relay
   doing the rendering hands back whatever the page looked like when it
   stopped waiting, which is sometimes the results and sometimes the empty
   frame they load into. JSON does not have that failure mode.

   The catch is that it is a POST, and a relay has to be willing to forward
   one. The public ones are not; a Worker of your own is.                  */
const JLC_SEARCH = "https://jlcpcb.com/api/overseas-pcb-order/v1/shoppingCart/smtGood/selectSmtComponentList";
async function lcscFindJlc(mpn, ms){
  const relay = lcsc.relay || demoRelay();
  if(!relay) return null;
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms||12000);
  try{
    const r = await fetch(lcscRoute(relay, JLC_SEARCH), {
      method:"POST", signal:ctl.signal,
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({keyword:mpn, currentPage:1, pageSize:8})
    });
    if(!r.ok) return null;
    const d = JSON.parse(await r.text());
    const list = d && d.data && d.data.componentPageInfo && d.data.componentPageInfo.list;
    if(!Array.isArray(list)) return null;
    const codes = [];
    for(const it of list){
      const c = lcscCode(it.componentCode || "");
      if(c && codes.indexOf(c) < 0) codes.push(c);
      if(codes.length >= 4) break;
    }
    return codes.length ? codes : null;
  }catch(e){ return null; }
  finally{ clearTimeout(timer); }
}

async function lcscFind(mpn){
  /* the better source first, when there is a relay that can reach it */
  let codes = await lcscFindJlc(mpn);

  if(!codes){
    const renderers = (lcsc.public?LCSC_PUBLIC:[]).filter(r=>r[2]);
    if(!renderers.length)
      throw new Error("searching by part number needs either a relay of your own or one of the built-in ones, and neither is available");
    const text = await lcscTextFrom(LCSC_SEARCH+encodeURIComponent(mpn), 30000, renderers);
    /* "0 results" is what their page says while it is still fetching, so
       seeing it here means the render was read too early just as often as it
       means the part is absent. Do not report it as an answer.            */
    if(/\b0 results\b/i.test(text) && !/product-detail\/C\d+\.html/.test(text))
      throw new Error("the search page came back before its results had loaded — try again, or open "+mpn+" on lcsc.com and put the code in directly");
    codes = [];
    const rx = /product-detail\/(C\d+)\.html/g;
    let m;
    while((m = rx.exec(text)) !== null && codes.length < 4)
      if(codes.indexOf(m[1])<0) codes.push(m[1]);
    if(!codes.length) throw new Error("nothing on that page looked like a part");
  }

  /* whichever found them, every candidate is read back and its real part
     number compared - JLCPCB return near neighbours too, answering
     SRN4018-220M with NRSE4018-220M, which is not the same part          */
  const want = mpnKey(mpn), out = [];
  for(const c of codes){
    try{
      const r = await lcscFetch(c);
      out.push({code:c, r, exact: mpnKey(r.productModel)===want});
    }catch(e){}
  }
  if(!out.length) throw new Error("the codes on that page could not be read back");
  out.sort((a,b)=>(b.exact?1:0)-(a.exact?1:0));
  return out;
}

function lcscUnitPrice(r){
  const l = Array.isArray(r.productPriceList) ? r.productPriceList : [];
  if(!l.length) return "";
  const p = Number(l[0].usdPrice != null ? l[0].usdPrice : l[0].productPrice);
  return isFinite(p) && p>0 ? String(+p.toFixed(5)) : "";
}
function lcscPrice(r){
  const l = Array.isArray(r.productPriceList) ? r.productPriceList : [];
  if(!l.length) return "";
  const first = l[0];
  const sym = first.currencySymbol || r.currencySymbol || "$";
  const p = Number(first.usdPrice != null ? first.usdPrice : first.productPrice);
  return isFinite(p) ? sym + p.toFixed(4).replace(/0+$/,"").replace(/\.$/,"") + " each" : "";
}

/* ------------------------------------------------- engineering notation ---
   What the search box reads a value with, so that "<=10k\u03a9" and a shelf
   holding "10m\u03a9" agree on what the prefix meant. Case matters, the way it
   does on a schematic: M is mega, m is milli.                              */
const SI_IN = {p:1e-12, n:1e-9, u:1e-6, "\u00b5":1e-6, m:1e-3, R:1, r:1, E:1,
               k:1e3, K:1e3, M:1e6, G:1e9, T:1e12};

/* The datasheet, or the next best thing. LCSC's own URLs carry a hash of the
   file, so a saved one dies the day they re-upload it - but the product page
   can always be worked out from the code, and that page has the current
   datasheet on it. A row is never left with no way through to the paper. */
function dsLink(p){
  const ds = String(p.ds||"").trim();
  if(ds) return `<a class="ds" href="${esc(ds)}" target="_blank" rel="noreferrer"
    title="datasheet" onclick="event.stopPropagation()">PDF</a>`;
  const code = lcscCode(p.lcsc);
  if(code) return `<a class="ds none" href="${esc(lcscPage(code))}" target="_blank" rel="noreferrer"
    title="no datasheet saved — open the part on lcsc.com" onclick="event.stopPropagation()">LCSC</a>`;
  return "";
}

/* A part with no picture, or one that cannot be found, keeps the same
   square with its package written in it, so the column never jumps.     */
function thumbHTML(p){
  const img = String(p.img||"").trim();

  const at = imgIsUrl(img) ? `src="${esc(img)}" referrerpolicy="no-referrer"` : `data-img="${esc(img)}"`;
  return `<div class="thumb"><img ${at} alt="" loading="lazy" decoding="async" width="56" height="56"
    data-pkg="${esc(p.pkg||"")}" onerror="imgDead(this)"></div>`;
}

  }
  return head + `<div class="rows">${list.map(rowHTML).join("")}</div>`;
}

        ? "A line matches its own part number or LCSC code, or not at all — the shelf is never searched by value. Use <b>Fill part numbers from LCSC</b> below to give the numberless lines one."

    </div>
    <table><thead><tr><th>Line</th><th>Matched</th><th>Value</th><th>How</th><th class="num">Need</th>

      const st = BOM_STATE[r.state];
      return `<tr><td class="m">${esc(r.mpn||r.lcsc||r.val)}${r.ref?`<br><span style="color:var(--ink3);font-size:11px">${esc(r.ref)}</span>`:""}</td>

          /* What it actually landed on. The package is the half that decides
             whether a match is the right one - an ambiguous value is refused

          return v ? esc(v) : `<span style="color:var(--ink3)">—</span>`;

/* A quantity is only wrong against the shelf it lands on. Ordering five when
   the alert level is fifty is fine if fifty are already there; ordering five
   onto an empty drawer is not. So the test is what the delivery leaves you
   with, and the line says the sum rather than just complaining.           */
function orderWarn(r){
  if(r.min===null || r.min===undefined || r.have===null || r.have===undefined) return "";
  const after = Number(r.have) + Number(r.qty||0);
  if(Number(r.qty||0) <= 0) return "nothing ordered — still "+r.have+", alert at "+r.min;
  if(after <= r.min) return "still low after this: "+r.have+" + "+r.qty+" = "+after+", alert at "+r.min;
  return "";
}

/* the note beside one line, and the running total, without a redraw */
function orderSync(i){
  const rows = ui.order||[];
  const r = rows[i];
  const note = document.querySelector('.ordnote[data-i="'+i+'"]');
  if(r && note){
    const warn = orderWarn(r);
    note.innerHTML = (r.qty < r.sug
        ? '<br><button class="linkish" data-ordreset="'+i+'" title="put the suggestion back">suggested '+r.sug+'</button>'
        : "") +
      (warn ? '<br><span style="color:var(--kapton)">'+esc(warn)+'</span>' : "");
  }
  const live = rows.filter(x=>Number(x.qty||0)>0);
  const c = document.querySelector(".tools .count");
  if(c) c.textContent = live.length+" lines · "+num(live.reduce((s,x)=>s+Number(x.qty||0),0))+" pieces";
}

/* ------------------------------------------------- ordered, not yet here --
   A shopping list stops being useful the moment it is sent: the parts are
   bought but not on the shelf, and the bin says you still have none. So a
   sent order is kept, and booking it in is one button rather than typing
   every line back in by hand.

   The box is asked for here rather than guessed, because a delivery is
   exactly when you decide where something is going to live. A part already
   on the shelf offers the drawer it is in; a part the bin has never seen
   offers the next free one.                                              */
function pendingAdd(){
  const rows = (ui.order||[]).filter(r=>Number(r.qty||0)>0);
  if(!rows.length) return toast("Nothing on the list");
  const free = (nextFree()[0]||{}).next || "";
  const o = {
    id: Date.now(),
    at: new Date().toISOString().slice(0,10),
    lines: rows.map(r=>{
      const p = db.parts.find(x=>x.lcsc && r.lcsc && x.lcsc===r.lcsc) ||
                db.parts.find(x=>x.mpn && r.mpn && x.mpn===r.mpn) || null;
      return {pid:p?p.id:null, lcsc:r.lcsc||"", mpn:r.mpn||"", val:r.val||"",
              cat:r.cat||"", qty:Number(r.qty), box:(p&&p.box)||"",
              desc:(p&&p.desc)||"", pkg:(p&&p.pkg)||""};
    })
  };
  db.pending = db.pending||[];
  db.pending.push(o);
  ui.order = null;
  save(); render();
  toast("Marked "+o.lines.length+" lines as ordered", "Undo", ()=>{
    db.pending = db.pending.filter(x=>x.id!==o.id);
    save(); render();
  });
}

function pendingPanel(){
  const list = db.pending||[];
  if(!list.length) return "";
  return list.map(o=>{
    const pcs = o.lines.reduce((s,l)=>s+Number(l.qty||0),0);
    const noBox = o.lines.filter(l=>!String(l.box||"").trim()).length;
    return `<div class="panel"><h2>On order · ${esc(o.at)}</h2>
      <p>${o.lines.length} line${o.lines.length===1?"":"s"} · ${num(pcs)} pieces, bought and not yet on the shelf.
         The box is where each one will go when it arrives — a part already on a shelf offers the drawer it is in.
         ${noBox?`<b style="color:var(--kapton)">${noBox} line${noBox===1?"":"s"} still ${noBox===1?"has":"have"} no box.</b>`
                :"Every line has a box."}</p>
      <table><thead><tr><th>LCSC</th><th>Part</th><th>Value</th><th>Description</th><th class="num">Coming</th><th>Box</th><th></th></tr></thead>
        <tbody>${o.lines.map((l,i)=>`<tr>
          <td class="m">${esc(l.lcsc)||`<span style="color:var(--ink3)">—</span>`}</td>
          <td class="m">${esc(l.mpn)}${l.pid?"":`<br><span style="color:var(--esd);font-size:11px">new part</span>`}</td>
          <td class="m">${l.val?esc(l.val):`<span style="color:var(--ink3)">—</span>`}</td>
          <td style="font-size:12px;color:var(--ink2);max-width:280px" title="${esc(l.desc||"")}">${
            l.desc ? esc(l.desc) : (l.pkg ? `<span class="pn">${esc(l.pkg)}</span>`
                                          : `<span style="color:var(--ink3)">—</span>`)}</td>
          <td class="num m">${l.qty}</td>
          <td><input class="pendbox" data-o="${o.id}" data-i="${i}" value="${esc(l.box)}"
                placeholder="C7" spellcheck="false" style="max-width:110px"></td>
          <td><button class="linkish" style="color:var(--alert)" data-penddrop="${o.id}:${i}">drop</button></td>
        </tr>`).join("")}</tbody></table>
      <div class="sheetbar">
        <button class="btn" data-pendtake="${o.id}">Book in ${num(pcs)} pieces</button>
        <button class="btn ghost" data-pendcancel="${o.id}">Cancel this order</button>
        <span style="color:var(--ink3);font-size:12px;flex:1;min-width:220px">Booking in adds every line to the shelf
          at once, with one movement per part in the log and a single undo. A line whose part the bin has never seen
          is created, in the category the order carried.</span></div>
    </div>`;
  }).join("");
}

function pendingReceive(id){
  const o = (db.pending||[]).find(x=>x.id===id);
  if(!o) return;
  const blank = o.lines.filter(l=>!String(l.box||"").trim());
  if(blank.length && !confirm(blank.length+" line"+(blank.length===1?"":"s")+
      " arriving with no box.\n\nBook them in anyway? They can be given one later, and the Parts view will list them under “missing box”.")) return;
  const undo = [];
  let made = 0;
  o.lines.forEach(l=>{
    let p = l.pid!==null ? db.parts.find(x=>x.id===l.pid) : null;
    if(!p && l.lcsc) p = db.parts.find(x=>x.lcsc===l.lcsc);
    if(p){
      const was = Number(p.qty||0), wasBox = p.box;
      undo.push({p, was, wasBox});
      p.qty = was + Number(l.qty||0);
      if(String(l.box||"").trim()) p.box = String(l.box).trim().toUpperCase();
      logAdd({k:"qty", id:p.id, mpn:p.mpn, lcsc:p.lcsc, cat:p.cat,
              d:Number(l.qty||0), a:was, b:p.qty});
    }else{
      const rec = {id: 1+db.parts.reduce((m,x)=>Math.max(m,x.id),0),
                   cat: l.cat || db.categories[0] || "Uncategorised",
                   lcsc:(l.lcsc||"").toUpperCase(), mpn:l.mpn||"", val:l.val||"", pkg:"", mfr:"",
                   qty:Number(l.qty||0), min:null, box:String(l.box||"").trim().toUpperCase(),
                   desc:"", src:"order", ds:""};
      if(rec.cat && !db.categories.includes(rec.cat)) db.categories.push(rec.cat);
      db.parts.push(rec);
      undo.push({p:rec, isNew:true});
      logAdd({k:"add", id:rec.id, mpn:rec.mpn, lcsc:rec.lcsc, cat:rec.cat, b:rec.qty});
      made++;
    }
  });
  const pcs = o.lines.reduce((s,l)=>s+Number(l.qty||0),0);
  db.pending = db.pending.filter(x=>x.id!==id);
  ui.order = null;
  save(); render();
  toast("Booked in "+num(pcs)+" pieces"+(made?", "+made+" new part"+(made===1?"":"s"):""), "Undo", ()=>{
    undo.forEach(u=>{ if(u.isNew) db.parts = db.parts.filter(x=>x!==u.p);
                      else { u.p.qty = u.was; u.p.box = u.wasBox; } });
    db.pending.push(o);
    save(); render();
  });
}

  return receivePanel() + pendingPanel() + `<div class="panel"><h2>Shopping list</h2>
      <p>Shortfalls from the BOM check plus everything at or below its own alert level.
         Low stock lines are topped back up to twice the alert level, at least 10 pieces.

function viewDupes(){
  const groups = [];
  const seen = new Set();
  const push = (key,label,list)=>{
    if(list.length<2) return;
    const sig = list.map(p=>p.id).sort().join(",");
    if(seen.has(sig)) return;
    seen.add(sig); groups.push({key,label,list});
  };
  const byL = new Map(), byM = new Map();
  const add = (m,k,p)=>{ if(!m.has(k)) m.set(k,[]); m.get(k).push(p); };
  for(const p of db.parts){
    if(/^C\d+$/.test(p.lcsc||"")) add(byL, p.lcsc, p);
    if(p.mpn) add(byM, p.mpn.toUpperCase(), p);
  }
  for(const [k,v] of byL) push(k,"LCSC",v);
  for(const [k,v] of byM) push(k,"Manufacturer",v);
  if(!groups.length) return `<div class="noresult"><b>No duplicates</b>Every part number appears once.</div>`;
  return `<div class="panel"><h2>${groups.length} duplicate groups</h2>
      <p>The same part in two rows splits the stock, and low-stock only looks at one of them.
         <b>Merge</b> adds the quantities into the first row and writes the boxes as an explicit split,
         so nothing is lost and the box view still knows what sits where.</p></div>
    <table><thead><tr><th>Key</th><th>Matched on</th><th>Category</th><th>Part</th><th class="num">Qty</th><th>Box</th><th></th></tr></thead><tbody>
    ${groups.map(g=>g.list.map((p,i)=>`<tr><td class="m">${i?"":esc(g.key)}</td><td class="m">${i?"":g.label}</td>
      <td>${esc(p.cat)}</td><td class="m">${esc(p.mpn)}</td><td class="num m">${num(p.qty)}</td>
      <td class="m">${esc(p.box)}</td>
      <td style="text-align:right">${i?"":`<button class="btn ghost" data-merge="${g.list.map(x=>x.id).join(",")}">Merge ${g.list.length}</button>`}</td></tr>`).join("") +
      `<tr class="groupsep"><td colspan="7"></td></tr>`).join("")}</tbody></table>`;
}

/* ---------------------------------------------------------------- actions */
function toast(msg, undoLabel, undoFn){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>` + (undoFn?`<button class="undo">${esc(undoLabel)}</button>`:"");
  t.hidden = false;
  if(undoFn) t.querySelector(".undo").onclick = ()=>{ t.hidden=true; undoFn(); };
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.hidden=true; }, undoFn?8000:2600);
}
function findPart(id){ return db.parts.find(p=>p.id===Number(id)); }

function logAdd(entry){
  db.log = db.log||[];
  db.log.push(Object.assign({t:new Date().toISOString(), dev:device}, entry));
  if(db.log.length>2000) db.log = db.log.slice(-2000);
}

function bump(p, d){
  const before = Number(p.qty||0);
  const after  = Math.max(0, before + d);
  if(after===before) return;
  p.qty = after;
  logAdd({k:"qty", id:p.id, mpn:p.mpn, lcsc:p.lcsc, cat:p.cat, d:after-before, a:before, b:after});
  save(); render();
}

      const hit = (ui.lcscFinds||[]).find(x=>x.code===pick.dataset.pick);
      if(!hit) return;
      const form = $("#sheet"), lc = form.elements.lcsc;

    if(imgIsUrl(v)){ imgPrev.referrerPolicy = "no-referrer"; imgPrev.src = v; imgPrev.hidden = false; }
    else imgResolve(v).then(u=>{ if(u && imgIn.value.trim()===v){ imgPrev.src = u; imgPrev.hidden = false; } else imgPrev.hidden = true; });
  };
  imgIn.addEventListener("input", imgShow);
  /* a value written by the lookup fires no event of its own */
  imgIn.addEventListener("lcsc", imgShow);
  imgShow();

  const first = $("#sheet input"); if(first) first.focus();
  /* opened from a scanned bag: read the rest of the part off LCSC straight away */
  if(isNew && s.lcsc && lcsc.auto) lcscFill();
