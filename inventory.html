<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parts Bin — component inventory</title>
<style>
:root{
  /* palette: printed bin label on the bench — paper, Kapton amber, ESD blue */
  --paper:#F7F6F2; --card:#FFFFFF; --ink:#16181C; --ink2:#5C636E; --ink3:#8D939C;
  --rule:#DCDAD3; --rule2:#EDEBE5;
  --kapton:#D9871A; --kapton-soft:#FBEBD0;
  --esd:#2F6F8F; --esd-soft:#E4EFF5;
  --alert:#C0304F; --alert-soft:#FBE3E8;
  --ok:#2C7A50;
  --label:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono","DejaVu Sans Mono",monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* author rules must not beat the hidden attribute */
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;
     -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

/* ---------- micro label type, the vernacular of a parts bin ---------- */
.lab{font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;
     font-size:11px;color:var(--ink3);font-weight:700}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:grid;
     grid-template-columns:auto 1fr auto;gap:18px;align-items:center;
     padding:10px 18px;background:var(--card);border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand-mark{font-family:var(--label);font-weight:700;font-size:20px;letter-spacing:.18em;
            text-transform:uppercase}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.02em}
.searchwrap{position:relative;max-width:620px}
#q{width:100%;padding:11px 40px 11px 14px;border:1.5px solid var(--rule);border-radius:2px;
   background:var(--paper);font-family:var(--mono);font-size:14px;outline:0}
#q:focus{border-color:var(--kapton);background:#fff;box-shadow:0 0 0 3px var(--kapton-soft)}
.hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);
      font-size:11px;color:var(--ink3);border:1px solid var(--rule);border-radius:3px;padding:1px 6px}
.views{display:flex;gap:2px}
.views button{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:12px;
              font-weight:700;color:var(--ink2);padding:8px 11px;border-bottom:2px solid transparent}
.views button:hover{color:var(--ink)}
.views button.on{color:var(--ink);border-bottom-color:var(--kapton)}

/* ---------- shell ---------- */
main{display:grid;grid-template-columns:236px 1fr;align-items:start;gap:0}
main.solo{grid-template-columns:1fr}   /* About: no rail, so no empty column */
.rail{position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto;
      padding:16px 14px 40px;border-right:1px solid var(--rule)}
.stage{padding:16px 18px 60px;min-width:0}

/* ---------- signature: the drawer wall ---------- */
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 20px}
.drawer{position:relative;aspect-ratio:1.35;border:1px solid var(--rule);background:var(--card);
        display:flex;flex-direction:column;justify-content:flex-end;padding:3px 4px;overflow:hidden}
.drawer .fill{position:absolute;left:0;right:0;bottom:0;background:var(--esd-soft)}
.drawer .k{position:relative;font-family:var(--label);font-weight:700;font-size:15px;line-height:1}
.drawer .n{position:relative;font-family:var(--mono);font-size:9px;color:var(--ink3)}
.drawer:hover{border-color:var(--esd)}
.drawer.on{border-color:var(--esd);border-width:2px;padding:2px 3px}
.drawer.on .fill{background:var(--esd);opacity:.16}
.drawer.ghost{border-style:dashed;color:var(--ink3);cursor:pointer}
.drawer.ghost .k{color:var(--kapton)}
.drawer.ghost:hover{border-color:var(--kapton);background:var(--kapton-soft)}

.railsec{margin-bottom:18px}
.railsec h3{margin:0 0 7px;font:inherit}
.chiprow{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 7px;border:1px solid var(--rule);
      background:var(--card);border-radius:2px;color:var(--ink2)}
.chip:hover{border-color:var(--ink3);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.alert.on{background:var(--alert);border-color:var(--alert)}
.catlist{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.cat{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;font-size:12.5px;
     border-radius:2px;text-align:left;width:100%}
.cat span:last-child{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.cat:hover{background:var(--rule2)}
.cat.on{background:var(--ink);color:#fff}
.cat.on span:last-child{color:#fff;opacity:.65}
.cat.none{color:var(--ink3)}
.cat span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat span:last-child{flex:none}

/* ---------- part rows: printed bin labels ---------- */
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.count{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.grow{flex:1}
select.sel{border:1px solid var(--rule);background:var(--card);padding:5px 8px;font-family:var(--mono);
           font-size:12px;border-radius:2px}
.btn{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:12px;
     border:1.5px solid var(--ink);padding:7px 13px;border-radius:2px;background:var(--ink);color:#fff}
.btn:hover{background:#000}
.btn.ghost{background:none;color:var(--ink)}
.btn.ghost:hover{background:var(--rule2)}
a.btn{display:inline-block;text-decoration:none}   /* a link wearing a button */

/* ---------- moving a category up or down its list ---------- */
.ord{font-family:var(--mono);font-size:14px;color:var(--ink3);padding:0 4px;line-height:1}
.ord:hover{color:var(--kapton)}
.ord[disabled]{opacity:.22;cursor:default}
.ord[disabled]:hover{color:var(--ink3)}
.grip{color:var(--ink3);cursor:grab;padding:0 2px;font-size:13px;line-height:1;user-select:none}
tr[data-catrow]{cursor:grab}
tr[data-catrow].dragging{opacity:.35}
tr[data-catrow].dropabove td{box-shadow:inset 0 2px 0 var(--kapton)}
tr[data-catrow].dropbelow td{box-shadow:inset 0 -2px 0 var(--kapton)}

.rows{display:flex;flex-direction:column;gap:5px}
.row{display:grid;grid-template-columns:56px 1fr auto;background:var(--card);
     border:1px solid var(--rule);border-radius:2px}
.row{cursor:pointer}
.row:hover{border-color:var(--ink3)}
.row:hover .more{color:var(--ink);border-color:var(--ink3)}
.row .tab{background:var(--esd-soft);border-right:1px solid var(--rule);display:flex;
          flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px}
.row .tab b{font-family:var(--label);font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--esd)}
.row .tab small{font-family:var(--mono);font-size:8.5px;color:var(--ink3)}
.row .tab.none{background:var(--rule2)}
.row .tab.none b{color:var(--ink3)}
.row .body{padding:8px 12px;min-width:0}
.line1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.pn{font-family:var(--mono);font-size:13.5px;font-weight:600}
.lcsc{font-family:var(--mono);font-size:11px;color:#fff;background:var(--ink2);padding:1px 5px;border-radius:2px}
.mfrtag{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:10.5px;
        color:var(--esd);border:1px solid var(--esd);background:var(--esd-soft);padding:1px 6px;border-radius:2px}
.mfrtag:hover{background:var(--esd);color:#fff}
.val{font-family:var(--mono);font-size:12.5px;color:var(--kapton);font-weight:600}
.line2{margin-top:3px;font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.line2 em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.dot{color:var(--rule)}
.qty{display:flex;align-items:center;gap:2px;padding:6px 8px 6px 4px;border-left:1px solid var(--rule2)}
.qnum{font-family:var(--mono);font-size:19px;font-weight:600;min-width:52px;text-align:right;
      padding-right:6px;font-variant-numeric:tabular-nums}
.low .qnum{color:var(--alert)}
.low{border-left:3px solid var(--alert)}
.step{width:26px;height:26px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);
      font-size:14px;color:var(--ink2);line-height:1}
.step:hover{border-color:var(--ink);color:var(--ink)}
.more{width:26px;height:26px;color:var(--ink3);font-size:13px;border:1px solid var(--rule);border-radius:2px}
.more:hover{color:var(--ink)}

/* ---------- tables (boxes / duplicates / log) ---------- */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule)}
th{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--ink2);
   text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--rule2);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:0}
td.m,th.m{font-family:var(--mono);font-size:12px}
td.num,th.num{text-align:right}
td.num{font-variant-numeric:tabular-nums}
.linkish{color:var(--esd);text-decoration:underline;text-underline-offset:2px}
.groupsep td{background:var(--paper);padding:3px}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--rule);padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 4px;font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:14px}
.panel p{margin:6px 0;color:var(--ink2);font-size:13px;max-width:70ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-family:var(--mono);font-size:12px;margin-top:8px}
.kv b{font-weight:600;color:var(--ink2)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}

/* ---------- editor ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,24,28,.42);z-index:50;display:flex;
         align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.sheet{background:var(--card);border:1px solid var(--ink);width:100%;max-width:620px;padding:20px}
.sheet h2{margin:0 0 14px;font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px}
.f.wide{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--rule);background:var(--paper);padding:7px 9px;
                               font-family:var(--mono);font-size:13px;border-radius:2px;outline:0;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--kapton);background:#fff}
.f small{color:var(--ink3);font-size:11px}
.sheetbar{display:flex;gap:8px;margin-top:16px;align-items:center}
.danger{color:var(--alert);border-color:var(--alert);background:none}
.danger:hover{background:var(--alert-soft)}

/* ---------- the LCSC lookup sitting in the editor ---------- */
.lcscrow{display:flex;gap:6px}
.lcscrow input{flex:1;min-width:0}
.lcscrow .btn{white-space:nowrap;font-size:10px;padding:0 10px;border-width:1px}
.btn[disabled]{opacity:.45;cursor:default}
.btn[disabled]:hover{background:var(--ink)}
.btn.ghost[disabled]:hover{background:none}
.lcscnote{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:1.65}
.lcscnote:empty{display:none}
.lcscnote b{color:var(--ink);font-weight:600}
.lcscnote .bad{color:var(--alert)}
/* a value LCSC offers for a field already filled in - never taken unasked */
.take{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);background:var(--paper);
      padding:2px 7px;border-radius:2px;margin:3px 4px 0 0;display:inline-block;color:var(--ink)}
.take:hover{border-color:var(--kapton);background:#fff}
.take em{font-style:normal;color:var(--ink3)}
.take.gone{opacity:.45;text-decoration:line-through}
.f input.fresh,.f select.fresh{background:var(--kapton-soft);border-color:var(--kapton)}

.fatal{margin:18px;padding:14px 16px;border:2px solid var(--alert);background:var(--alert-soft);
       font-family:var(--mono);font-size:13px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
       padding:9px 16px;border-radius:2px;font-family:var(--mono);font-size:12.5px;z-index:60;
       display:flex;align-items:center;gap:14px}
.toast .undo{font-family:var(--label);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
             font-size:11px;color:var(--kapton);border:1px solid var(--kapton);padding:3px 9px;border-radius:2px}
.toast .undo:hover{background:var(--kapton);color:var(--ink)}
.noresult{padding:40px 4px;color:var(--ink2)}
.noresult b{display:block;font-family:var(--label);text-transform:uppercase;letter-spacing:.12em;
         font-size:15px;color:var(--ink);margin-bottom:4px}

.stockbtn{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-weight:700;
           font-size:10px;border:1px solid currentColor;padding:2px 7px;border-radius:2px;background:none}
.stockbtn:hover{background:var(--rule2)}
.schem{border:1px solid var(--rule2);background:var(--paper);padding:10px 6px;margin-bottom:14px;border-radius:2px}
.schem svg{max-height:260px}
@media print{ .schem{border-color:#000} }

.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.label{border:1px solid var(--ink);background:var(--card);padding:8px 10px;break-inside:avoid}
.label-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);
         padding-bottom:4px;margin-bottom:5px}
.label-h b{font-family:var(--label);font-size:26px;font-weight:700;letter-spacing:.06em;line-height:1}
.label-h span{font-family:var(--mono);font-size:9.5px;color:var(--ink2)}
.label ul{list-style:none;margin:0;padding:0}
.label li{display:grid;grid-template-columns:1fr auto auto;gap:6px;font-size:10px;line-height:1.45;
          border-bottom:1px dotted var(--rule2);padding:1px 0}
.label li span{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.label li em{font-style:normal;color:var(--ink3);font-family:var(--mono);font-size:9px}
.label li b{font-family:var(--mono);font-weight:600;min-width:34px;text-align:right}

@media print{
  .top,.rail,.noprint{display:none!important}
  main{display:block}
  .stage{padding:0}
  body{background:#fff}
  .labels{grid-template-columns:repeat(3,1fr);gap:6px}
  .label{border-color:#000}
  @page{margin:10mm}
}

@media (max-width:860px){
  main{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule)}
  .wall{grid-template-columns:repeat(8,1fr)}
  .top{grid-template-columns:1fr;gap:10px}
  .views{overflow:auto}
}
@media (prefers-reduced-motion:no-preference){
  .row{transition:border-color .12s ease}
  .drawer{transition:border-color .12s ease}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="brand-mark">Parts Bin</span>
    <span class="brand-sub" id="storageChip">starting…</span>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="10k 0603   ·   STM32   ·   C1779   ·   tvs" autocomplete="off" spellcheck="false">
    <span class="hint">/</span>
  </div>
  <nav class="views" id="views">
    <button data-view="parts" class="on">Parts</button>
    <button data-view="boxes">Boxes</button>
    <button data-view="bom">BOM</button>
    <button data-view="order">Order</button>
    <button data-view="dupes">Duplicates</button>
    <button data-view="calc">Calc</button>
    <button data-view="log">Log</button>
    <button data-view="data">Data</button>
    <button data-view="about">About</button>
  </nav>
</header>

<main>
  <aside class="rail" id="rail">
    <div class="railsec" id="boxSec">
      <h3 class="lab">Boxes</h3>
      <div class="wall" id="wall"></div>
      <div class="chiprow">
        <button class="chip alert" id="lowChip">low stock</button>
        <button class="chip" id="clearChip">clear filters</button>
      </div>
    </div>
    <div class="railsec" id="missSec">
      <h3 class="lab">Missing</h3>
      <div class="chiprow" id="missChips"></div>
    </div>
    <div class="railsec">
      <h3 class="lab" id="catHead">Categories</h3>
      <div class="catlist" id="cats"></div>
    </div>
  </aside>
  <section class="stage" id="stage"></section>
</main>

<noscript><div class="fatal">This viewer is not running JavaScript. Download the file and open it in Firefox, Chrome or Edge.</div></noscript>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* This page carries no inventory. The data lives in the repository you
   configure under Data, or in a local file you connect there.              */
const SEED = {version:1, categories:[], boxes:[], parts:[], log:[], boms:[]};
/* The storage keys keep the old name on purpose. They are what an existing
   browser looks under, and renaming them would hide every inventory already
   saved on a machine that has been using this page.                         */
const KEY = "parts-bin-v1";
const APP_VERSION = "1.5.0";
const REPO_URL = "https://github.com/AbdullahJalloul/parts-bin-app";

/* ------------------------------------------------------------------ state */
let db = null;
let fileHandle = null;      /* live, writable */
let pendingHandle = null;   /* remembered from last session, needs one click */
let saveTimer = null;
let lastSaved = null;
let fileStamp = null;       /* lastModified seen by this tab, detects outside edits */
let ghTimer = null;
let ghPushPending = false;  /* a debounced push is waiting to go out */
const ui = { q:"", cat:"", box:"", low:false, sort:"cat", view:"parts", editCat:null, moveCat:null, mfr:"", bomText:"", bomQty:1, bomRows:null, order:null, calc:"ohm", calcVals:{}, bomName:"", rcvText:"", receive:null, lcscBulk:null, lcscFinds:null };

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => (Math.round(n*100)/100).toLocaleString("en-US");

/* ---------------------------------------------------------------- storage */
/* A file handle survives a reload only if it is stored in IndexedDB. Every
   call is guarded: private windows and file:// origins may refuse it.       */
function idbOpen(){
  return new Promise((res,rej)=>{
    try{
      const r = indexedDB.open("parts-bin",1);
      r.onupgradeneeded = ()=> r.result.createObjectStore("kv");
      r.onsuccess = ()=> res(r.result);
      r.onerror   = ()=> rej(r.error);
    }catch(e){ rej(e); }
  });
}
async function idbSet(k,v){
  try{ const d = await idbOpen();
    return await new Promise((res,rej)=>{ const t=d.transaction("kv","readwrite");
      t.objectStore("kv").put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); });
  }catch(e){ return false; }
}
async function idbGet(k){
  try{ const d = await idbOpen();
    return await new Promise(res=>{ const t=d.transaction("kv","readonly");
      const q=t.objectStore("kv").get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); });
  }catch(e){ return null; }
}

function localLoad(){ try{ const t=localStorage.getItem(KEY); return t?JSON.parse(t):null; }catch(e){ return null; } }
function localSave(){ try{ localStorage.setItem(KEY,JSON.stringify(db)); return true; }catch(e){ return false; } }

async function fileWrite(){
  if(!fileHandle) return false;
  try{
    /* another machine may have written through Dropbox / OneDrive while this
       tab was idle - never blindly overwrite a newer copy                    */
    const on = await fileHandle.getFile();
    if(fileStamp!==null && on.lastModified!==fileStamp){
      const text = await on.text();
      let theirs = null;
      try{ theirs = JSON.parse(text); }catch(e){}
      if(theirs && Array.isArray(theirs.parts) && (theirs.updated||"") > (db.updated||"")){
        const keep = db.log;
        db = normalize(theirs); db.log = mergeLog(keep, db.log);
        localSave(); fileStamp = on.lastModified;
        render(); toast("Took the newer copy from "+fileHandle.name);
        return true;
      }
    }
    const w = await fileHandle.createWritable();
    await w.write(new Blob([JSON.stringify(db,null,1)],{type:"application/json"}));
    await w.close();
    try{ fileStamp = (await fileHandle.getFile()).lastModified; }catch(e){}
    lastSaved = new Date();
    chip();
    return true;
  }catch(e){
    toast("Could not write to "+fileHandle.name+": "+e.message);
    fileHandle = null; chip(); render();
    return false;
  }
}

/* the file wins when it is newer than the copy in this browser */
async function adoptFile(){
  try{
    const text = await (await fileHandle.getFile()).text();
    if(!text.trim()) return fileWrite();
    const onDisk = JSON.parse(text);
    if(onDisk && Array.isArray(onDisk.parts) && onDisk.parts.length){
      const a = onDisk.updated||"", b = (db&&db.updated)||"";
      if(a > b){ const keep = db.log; db = normalize(onDisk); db.log = mergeLog(keep, db.log);
                 localSave(); toast("Loaded the newer copy from "+fileHandle.name); }
      else await fileWrite();
    } else await fileWrite();
    try{ fileStamp = (await fileHandle.getFile()).lastModified; }catch(e){}
  }catch(e){ toast("Could not read "+fileHandle.name+": "+e.message); }
}

function save(){
  db.updated = new Date().toISOString();
  const ok = localSave();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(fileWrite, 400);
  if(gh.auto && ghReady() && ghPulled){
    clearTimeout(ghTimer);
    ghPushPending = true;
    ghTimer = setTimeout(()=>ghPush(true), 5000);
  }
  chip(ok);
}

/* One shot: the first interaction anywhere counts as user activation, which
   is all requestPermission needs. Silent when the browser says yes.        */
let reconnectArmed = false;
function armReconnect(){
  if(reconnectArmed || !pendingHandle) return;
  reconnectArmed = true;
  const tryIt = async ()=>{
    if(!pendingHandle) return done();
    let perm = "prompt";
    try{ perm = await pendingHandle.requestPermission({mode:"readwrite"}); }catch(e){ return; }
    if(perm === "granted"){
      fileHandle = pendingHandle; pendingHandle = null;
      done();
      await adoptFile(); chip(); render();
      toast("Writing to " + fileHandle.name + " again");
    }
    /* refused: leave the handle parked, the Data tab still offers the button */
  };
  const done = ()=>{
    document.removeEventListener("pointerdown", tryIt, true);
    document.removeEventListener("keydown", tryIt, true);
    reconnectArmed = false;
  };
  document.addEventListener("pointerdown", tryIt, true);
  document.addEventListener("keydown", tryIt, true);
}

/* Chrome ties a lasting file permission to an origin. A page opened from
   file:// has no stable origin, so "Allow on every visit" has nothing to
   attach to and the prompt returns every session. Say so, rather than
   implying the grant should have stuck.                                      */
const IS_FILE_URL = location.protocol === "file:";

function chip(localOk){
  const el = $("#storageChip");
  if(fileHandle){
    el.innerHTML = esc(fileHandle.name) + (lastSaved
      ? ' · <span style="color:var(--ok)">saved ' + lastSaved.toTimeString().slice(0,8) + "</span>"
      : " · connected");
  } else if(pendingHandle){
    el.innerHTML = 'click anywhere to reopen ' + esc(pendingHandle.name) +
                   ' · <button class="linkish" id="reconnect">or here</button>' +
                   (IS_FILE_URL ? ' · <span title="a file:// page cannot keep the grant — see the Data tab">file:// asks every time</span>' : '');
  } else if(ghReady()){
    /* the repository is the store - a local file would only add a prompt */
    const when = gh.at ? new Date(gh.at).toTimeString().slice(0,8) : "";
    let state;
    if(ghPushPending) state = ' · <span style="color:var(--kapton)">syncing…</span>';
    else if(!ghPulled) state = ' · <button class="linkish" data-view-go="data">pull once</button>';
    else if(gh.auto)   state = when ? ' · <span style="color:var(--ok)">synced ' + when + "</span>"
                                    : ' · <span style="color:var(--ok)">sync on</span>';
    else               state = ' · <button class="linkish" data-view-go="data">push in Data</button>';
    el.innerHTML = esc(gh.repo) + state;
  } else if(localOk!==false){
    el.innerHTML = 'saved in this browser · <button class="linkish" data-view-go="data">set up a store</button>';
  } else {
    el.textContent = "memory only · export from Data before closing";
  }
}

/* --------------------------------------------------------------- GitHub ---
   Reads and writes one file in a private repository straight from the page.
   The token lives in this browser only and is never written into the data
   file, so exporting or pushing the inventory cannot leak it.               */
/* The browser cannot read the machine's hostname - there is no such API - so
   each computer carries a label you set once. It lives in this browser only
   and is never synced, otherwise every machine would claim the same name.  */
const DEV_KEY = "parts-bin-device";
let device = "";
function guessDevice(){
  const p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
  if(/win/i.test(p))            return "Windows PC";
  if(/mac/i.test(p))            return "Mac";
  if(/iphone|ipad/i.test(p))    return "iPhone";
  if(/android/i.test(p))        return "Android";
  if(/linux/i.test(p))          return "Linux PC";
  return "This computer";
}
function devLoad(){
  try{ device = localStorage.getItem(DEV_KEY) || ""; }catch(e){}
  if(!device) device = guessDevice();
}
function devSave(v){ device = v || guessDevice(); try{ localStorage.setItem(DEV_KEY, device); }catch(e){} }

const GH_KEY = "parts-bin-gh";
let gh = {repo:"", path:"components.json", branch:"main", token:"", sha:null, auto:false, at:null};
let ghPulled = false;   /* auto push is armed only after a successful pull */

function ghLoad(){ try{ const t=localStorage.getItem(GH_KEY); if(t) Object.assign(gh, JSON.parse(t)); }catch(e){} }
function ghSave(){ try{ localStorage.setItem(GH_KEY, JSON.stringify(gh)); }catch(e){} }
function ghReady(){ return !!(gh.repo && gh.token); }
function ghApi(){ return "https://api.github.com/repos/"+gh.repo+"/contents/"+
                         gh.path.split("/").map(encodeURIComponent).join("/"); }
function ghHead(){ return {Authorization:"Bearer "+gh.token, Accept:"application/vnd.github+json",
                           "X-GitHub-Api-Version":"2022-11-28"}; }
async function ghErr(r){ try{ const j = await r.json(); return j.message || ("HTTP "+r.status); }
                         catch(e){ return "HTTP "+r.status; } }

/* base64 both ways, UTF-8 safe: the data holds ±, Ω, ℃, İ */
function b64enc(str){
  const b = new TextEncoder().encode(str);
  let s = "";
  for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i,i+0x8000));
  return btoa(s);
}
function b64dec(t){
  const s = atob(String(t).replace(/\s/g,""));
  const b = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) b[i] = s.charCodeAt(i);
  return new TextDecoder().decode(b);
}

/* Movements from both machines are kept. Parts are still last writer wins,
   only the log is merged.                                                   */
function mergeLog(mine, theirs){
  const key = l => [l.t, l.dev||"", l.id||"", l.k||"qty", l.d||""].join("|");
  const seen = new Set(), out = [];
  for(const l of (theirs||[]).concat(mine||[])){
    const k = key(l);
    if(seen.has(k)) continue;
    seen.add(k); out.push(l);
  }
  out.sort((a,b)=> String(a.t||"").localeCompare(String(b.t||"")));
  return out.slice(-2000);
}

async function ghPull(quiet){
  if(!ghReady()) return toast("Fill in the repository and the token first");
  try{
    const r = await fetch(ghApi()+"?ref="+encodeURIComponent(gh.branch)+"&t="+Date.now(),
                          {headers:ghHead(), cache:"no-store"});
    if(r.status===404){ gh.sha=null; ghPulled=true; ghSave(); render();
                        if(!quiet) toast("Nothing at that path yet — push to create it"); return; }
    if(!r.ok) throw new Error(await ghErr(r));
    const j = await r.json();
    const next = JSON.parse(b64dec(j.content||""));
    if(!next || !Array.isArray(next.parts)) throw new Error("that file is not inventory data");
    gh.sha = j.sha; gh.at = new Date().toISOString(); ghPulled = true; ghSave(); chip();
    const keep = db && db.log;
    db = normalize(next);
    db.log = mergeLog(keep, db.log);
    localSave(); if(fileHandle) await fileWrite();
    render(); if(!quiet) toast("Pulled "+db.parts.length+" parts from GitHub");
  }catch(e){ chip(); toast("Pull failed: "+e.message); }
}

async function ghPush(quiet, force){
  if(!ghReady()) return toast("Fill in the repository and the token first");
  if(!ghPulled && !force) return toast("Pull once first, so this machine does not overwrite the others");
  try{
    if(force){                       /* adopt whatever sha is there right now */
      const c = await fetch(ghApi()+"?ref="+encodeURIComponent(gh.branch)+"&t="+Date.now(),
                            {headers:ghHead(), cache:"no-store"});
      gh.sha = c.ok ? (await c.json()).sha : null;
    }
    const body = {branch: gh.branch,
                  message: "inventory · "+db.parts.length+" parts · "+new Date().toISOString().slice(0,19).replace("T"," "),
                  content: b64enc(JSON.stringify(db,null,1))};
    if(gh.sha) body.sha = gh.sha;
    const r = await fetch(ghApi(), {method:"PUT",
      headers:Object.assign({"Content-Type":"application/json"}, ghHead()), body:JSON.stringify(body)});
    if(r.status===409 || r.status===422){
      ghPushPending = false; chip();
      toast("GitHub holds a newer version than this machine", "Pull it", ()=>ghPull());
      return;
    }
    if(!r.ok) throw new Error(await ghErr(r));
    gh.sha = (await r.json()).content.sha; gh.at = new Date().toISOString(); ghPulled = true; ghSave();
    ghPushPending = false; chip();
    render(); if(!quiet) toast("Pushed to GitHub");
  }catch(e){ ghPushPending = false; chip(); toast("Push failed: "+e.message); }
}

/* ------------------------------------------------------------ box parsing */
/* mirrors the spreadsheet rules: "C1 + C6" splits the quantity equally,
   "C1:50 + C6:20" states it explicitly                                     */
function boxTokens(raw){
  return String(raw||"").split(/[+,;/&]/).map(t=>t.trim()).filter(Boolean);
}
function parseTok(tok){
  const m = /^([A-Za-z]*)(\d+)(?::(-?\d+(?:\.\d+)?))?$/.exec(tok.replace(/\s+/g,""));
  if(!m) return null;
  return { key:(m[1]||"").toUpperCase()+m[2], pre:(m[1]||"").toUpperCase(),
           n:parseInt(m[2],10), qty:m[3]!==undefined?parseFloat(m[3]):null };
}
function partBoxes(p){ return boxTokens(p.box).map(parseTok).filter(Boolean); }

function qtyInBox(p, key){
  const toks = partBoxes(p);
  const mine = toks.find(t=>t.key===key);
  if(!mine) return null;
  if(mine.qty!==null) return mine.qty;
  const explicit = toks.filter(t=>t.qty!==null).reduce((s,t)=>s+t.qty,0);
  const free = toks.filter(t=>t.qty===null).length;
  return free ? Math.max(0,(p.qty||0)-explicit)/free : 0;
}

function boxStats(){
  const map = new Map();
  for(const p of db.parts){
    for(const t of partBoxes(p)){
      let e = map.get(t.key);
      if(!e){ e = {key:t.key, pre:t.pre, n:t.n, items:0, qty:0, cats:new Set()}; map.set(t.key,e); }
      e.items++; e.qty += qtyInBox(p,t.key)||0; e.cats.add(p.cat);
    }
  }
  return [...map.values()].sort((a,b)=> a.pre===b.pre ? a.n-b.n : a.pre.localeCompare(b.pre));
}

function nextFree(){
  const out = [];
  const st = boxStats();
  const pres = [...new Set(st.map(b=>b.pre))];
  for(const pre of pres){
    const ns = st.filter(b=>b.pre===pre).map(b=>b.n);
    const min = Math.min(...ns), max = Math.max(...ns);
    const gaps = [];
    for(let i=min;i<=max;i++) if(!ns.includes(i)) gaps.push(pre+i);
    out.push({pre, used:ns.length, range:pre+min+"–"+pre+max, gaps, next:pre+(max+1)});
  }
  return out;
}

/* ------------------------------------------------------------------ query */
const minOf = p => (p.min===null||p.min===undefined||p.min==="") ? 2 : Number(p.min);
const isLow = p => Number(p.qty||0) <= minOf(p);

function haystack(p){
  return [p.lcsc,p.mpn,p.val,p.pkg,p.mfr,p.desc,p.cat,p.box,p.src].join(" ").toUpperCase();
}

/* one search term. Plain text scans every field; "box:C7" scans one field;
   "qty<10" compares the quantity.                                          */
const FIELDS = {BOX:"box", CAT:"cat", PKG:"pkg", LCSC:"lcsc", MPN:"mpn", VAL:"val",
                DESC:"desc", SRC:"src", MFR:"mfr", MAKER:"mfr"};
/* the same fields, addressed by whether they are filled in at all */
const BLANK_FIELDS = {VALUE:"val", VAL:"val", BOX:"box", LCSC:"lcsc", MPN:"mpn",
                      MFR:"mfr", MAKER:"mfr", MANUFACTURER:"mfr", PKG:"pkg", PACKAGE:"pkg",
                      DESC:"desc", DESCRIPTION:"desc", SRC:"src", SOURCE:"src",
                      SUPPLIER:"src", MIN:"min", CAT:"cat", CATEGORY:"cat"};
function matches(p, term){
  /* "no:value" and "has:box" ask whether a field is filled, not what it holds */
  const nf = /^(NO|HAS|MISSING):(.+)$/.exec(term);
  if(nf){
    const key = BLANK_FIELDS[nf[2]];
    if(key){
      const blank = String(p[key]==null?"":p[key]).trim()==="";
      return nf[1]==="HAS" ? !blank : blank;
    }
    return false;
  }
  const f = /^([A-Z]+):(.*)$/.exec(term);
  if(f && FIELDS[f[1]]) return String(p[FIELDS[f[1]]]||"").toUpperCase().includes(f[2]);
  const c = /^QTY(<=|>=|<|>|=)(\d+(?:\.\d+)?)$/.exec(term);
  if(c){
    const n = Number(p.qty||0), r = Number(c[2]);
    return c[1]==="<" ? n<r : c[1]===">" ? n>r : c[1]==="<=" ? n<=r : c[1]===">=" ? n>=r : n===r;
  }
  return haystack(p).includes(term);
}
const anyFilter = ()=> !!(ui.cat || ui.box || ui.low || ui.mfr);

function filtered(queryOnly){
  const terms = ui.q.trim().toUpperCase().split(/\s+/).filter(Boolean);
  let list = db.parts.filter(p=>{
    if(!queryOnly){
      if(ui.cat && p.cat!==ui.cat) return false;
      if(ui.mfr && (p.mfr||"")!==ui.mfr) return false;
      if(ui.box && !partBoxes(p).some(t=>t.key===ui.box)) return false;
      if(ui.low && !isLow(p)) return false;
    }
    if(terms.length) return terms.every(t=>matches(p,t));
    return true;
  });
  /* Sorting by category follows the order the categories are kept in, not the
     alphabet - that order is the one arranged under Data, and a bench rarely
     wants its shelves alphabetised. Anything not on the list sinks.         */
  const rank = new Map(db.categories.map((c,i)=>[c,i]));
  const cr = c => rank.has(c) ? rank.get(c) : 1e6;
  const by = {
    cat:(a,b)=> cr(a.cat)-cr(b.cat) || (a.mpn||"").localeCompare(b.mpn||""),
    qty:(a,b)=> (a.qty||0)-(b.qty||0),
    qtyd:(a,b)=> (b.qty||0)-(a.qty||0),
    box:(a,b)=>{ const A=partBoxes(a)[0],B=partBoxes(b)[0];
                 return (A?A.n:999)-(B?B.n:999) || cr(a.cat)-cr(b.cat); },
    mpn:(a,b)=> (a.mpn||"").localeCompare(b.mpn||"")
  };
  return list.sort(by[ui.sort]||by.cat);
}

/* The fields worth chasing, in the order they cost you the most:
   a value breaks matching, a box loses the part, the rest are cosmetic.     */
const MISSING_CHIPS = [["value","val"],["box","box"],["lcsc","lcsc"],
                       ["mfr","mfr"],["pkg","pkg"],["desc","desc"]];
const blankCount = key => db.parts.filter(p=>String(p[key]==null?"":p[key]).trim()==="").length;

/* Manufacturers in use, most parts first. */
function mfrList(){
  const m = new Map();
  for(const p of db.parts){ const k = (p.mfr||"").trim(); if(k) m.set(k, (m.get(k)||0)+1); }
  return [...m].map(([name,n])=>({name,n})).sort((a,b)=> b.n-a.n || a.name.localeCompare(b.name));
}

/* Only prefixes whose maker is unambiguous. Anything a generic house also
   builds (1N4148, SS14, 2N7002) is deliberately absent - a wrong maker on a
   BOM line is worse than an empty one.                                      */
const MFR_RULES = [
  [/^CL\d{2}[ABC]/,        "Samsung Electro-Mechanics"],
  [/^(GRM|GCM|GJM|NFM|BLM|LQ[HMW])/, "Murata"],
  [/^(CC0\d{3}|RC0\d{3}FR|AC0\d{3}|RT0\d{3})/, "YAGEO"],
  [/^0\d{3}(WA|WG)[FJ]/,   "UNI-ROYAL"],
  [/^STM(32|8)/,           "STMicroelectronics"],
  [/^(MCP|ATMEGA|ATTINY|AT24|PIC1)/, "Microchip"],
  [/^ESP(32|8266|-)/,      "Espressif"],
  [/^AMS1117/,             "AMS"],
  [/^(TL0|TPS|LM3\d\d|SN74|INA2)/, "Texas Instruments"],
  [/^WJ\d/,                "WanJie"]
];
function suggestMfr(){
  const out = [];
  for(const p of db.parts){
    if((p.mfr||"").trim()) continue;
    const m = (p.mpn||"").toUpperCase();
    for(const [rx,name] of MFR_RULES){ if(rx.test(m)){ out.push({p, name}); break; } }
  }
  return out;
}

/* ------------------------------------------------------------------ BOM ---
   A pasted bill of materials, matched against the bin. Matching runs in three
   passes because a BOM rarely carries everything: exact manufacturer part
   number, then LCSC code, then value plus package.                          */

/* "10 kΩ" "10k" "4k7" "4.7uF" "100 nF" all collapse to one comparable number.
   Two conventions have to be handled: the multiplier can stand in for the
   decimal point (4u7 = 4.7uF, 4k7 = 4.7k), and "M" means mega on a resistor
   but milli on a capacitor - the trailing F is what tells them apart.       */
/* "100V 100nF X7R ±10%" holds three numbers and only one of them is the
   capacitance. Pick the token that actually names a farad, henry or ohm
   value before parsing, or the voltage rating wins and every match is wrong. */
function pickValueToken(raw){
  const toks = String(raw||"").split(/[\s,]+/).filter(Boolean);
  let fallback = null;
  for(const tok of toks){
    const T = tok.toUpperCase();
    if(/[%±]/.test(T)) continue;                          /* a tolerance */
    if(T.indexOf("@") >= 0) continue;                        /* "1Ω@100kHz" */
    if(/\d\s*(V|VDC|VAC|A|MA|W|MW|PPM)$/.test(T)) continue;    /* a rating */
    if(!/\d/.test(T)) continue;
    if(/(F|H|Ω|OHM)$/i.test(T)) return T;                   /* names its unit */
    if(/^\d+(\.\d+)?[PNUµμMKGR]/i.test(T)) return T;         /* carries a prefix */
    if(fallback === null) fallback = T;
  }
  return fallback === null ? String(raw||"") : fallback;
}
function normValue(v){
  /* the micro sign uppercases to Greek capital mu, which would then be read
     as milli - fold every micro spelling to U before anything else          */
  let t = pickValueToken(v).replace(/[µμ]/g,"u").toUpperCase()
                       .replace(/Μ/g,"U").replace(/Ω|OHMS?/g,"").replace(/\s+/g,"");
  const farads = /F$|F[^A-Z0-9]/.test(t) || /(P|N|U)F/.test(t);
  const m = /(\d+(?:[.,]\d+)?)(MEG|[PNUMKRE])?(\d+)?/.exec(t);
  if(!m) return "";
  let whole = m[1].replace(",",".");
  let unit  = m[2] || "";
  /* 4k7 / 1R2 / 4u7 : the digits after the letter are the decimal part */
  if(m[3] && unit && unit !== "MEG") whole = whole + "." + m[3];
  let n = parseFloat(whole);
  if(!isFinite(n)) return "";
  const mult = {P:1e-12, N:1e-9, U:1e-6, K:1e3, MEG:1e6, R:1, E:1, "":1,
                M: farads ? 1e-3 : 1e6};
  n *= (mult[unit]!==undefined ? mult[unit] : 1);
  return n.toExponential(4);
}
function normPkg(v){ return String(v||"").toUpperCase().replace(/[\s\-_]/g,""); }

/* A spreadsheet treats 0402 as a number and hands back 402, and a fab reading
   "402" has no idea what size to fit. Only pad when the padded form is a size
   that actually exists, so anything else keeping three digits is left alone. */
const PKG_PAD = new Set(["0201","0402","0603","0805","0505","0605"]);
function padPkg(v){
  const s = String(v||"").trim();
  return (/^\d{3}$/.test(s) && PKG_PAD.has("0"+s)) ? "0"+s : s;
}

function splitLine(line){
  /* comma, semicolon or tab separated, quoted fields respected */
  const out = []; let cur = "", q = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(c === '"'){ if(q && line[i+1]==='"'){ cur+='"'; i++; } else q = !q; }
    else if(!q && (c === "," || c === ";" || c === "\t")){ out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(x=>x.trim().replace(/^"|"$/g,""));
}

/* Tested in this order: the first match wins, so "LCSC Part Number" is read
   as a supplier code and never as a manufacturer part number.               */
const BOM_COLS = [
  ["lcsc", /lcsc|supplier\s*part|jlcpcb/i],
  ["mpn",  /manufact\w*\s*part|mfr\.?\s*part|^mpn$|^part\s*(number|no\.?)$|^partnumber$|^part#$|^comment$/i],
  ["qty",  /^(order\s*|purchase\s*|buy\s*)?(qty|quantity|count|qnty|pcs)\.?$|\bqty$|\bquantity$/i],
  ["val",  /^(value|val)$/i],
  ["pkg",  /^(package|footprint|pkg|case)$/i],
  ["ref",  /^(ref|refs|reference|references|designator|designators)$/i]
];

function parseBom(text){
  const lines = String(text||"").split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const first = splitLine(lines[0]);
  const map = {};
  first.forEach((h,i)=>{
    const hit = BOM_COLS.find(c=> c[1].test(String(h).trim()));
    if(hit && map[hit[0]] === undefined) map[hit[0]] = i;
  });
  const hasHeader = Object.keys(map).length >= 2;

  const rows = [];
  (hasHeader ? lines.slice(1) : lines).forEach(line=>{
    const c = splitLine(line);
    if(!c.join("").trim()) return;
    let r;
    if(hasHeader){
      r = {mpn:c[map.mpn]||"", lcsc:c[map.lcsc]||"", val:c[map.val]||"",
           pkg:padPkg(c[map.pkg]), ref:c[map.ref]||"",
           need: map.qty!==undefined ? Number(String(c[map.qty]).replace(/[^\d.]/g,""))||0 : 0};
      if(!r.need && map.ref!==undefined) r.need = (r.ref.match(/[A-Z]+\d+/gi)||[]).length;
      if(!r.need) r.need = 1;
    } else {
      /* headerless: "part, qty" or one part per line */
      const n = Number(String(c[c.length-1]).replace(/[^\d.]/g,""));
      const hasQty = c.length>1 && String(c[c.length-1]).trim()!=="" && !isNaN(n) && n>0;
      r = {mpn:c[0]||"", lcsc:"", val:c[1]&&!hasQty?c[1]:"", pkg:"", ref:"",
           need: hasQty ? n : 1};
    }
    if(/^C\d+$/i.test(r.mpn) && !r.lcsc){ r.lcsc = r.mpn; r.mpn = ""; }
    if(r.mpn || r.lcsc || r.val) rows.push(r);
  });
  return rows;
}

/* A part number and an LCSC code name one part and nothing else. A value does
   not: the matcher reduces "25V 4.7uF X5R ±10%" to 4.7e-6 before comparing,
   so the voltage, the tolerance and the dielectric fall out on the way, and a
   50V ±20% part answers to a 25V ±10% line. That is useful on a decoupling
   cap and wrong on a divider, which is why it is a choice rather than a rule:

     value  - fall back to value plus package when there is no number
     exact  - a line matches its own part number or its LCSC code, or it does
              not match. Nothing is inferred from the shelf.                */
function matchBom(row){
  const mpn = String(row.mpn||"").trim().toUpperCase();
  const lcsc = String(row.lcsc||"").trim().toUpperCase();
  if(mpn){ const h = db.parts.find(p=>(p.mpn||"").toUpperCase()===mpn); if(h) return {p:h, how:"part number"}; }
  if(lcsc){ const h = db.parts.find(p=>(p.lcsc||"").toUpperCase()===lcsc); if(h) return {p:h, how:"LCSC"}; }
  if(prefs.bomMatch === "exact") return {p:null, how:""};
  if(row.val){
    const v = normValue(row.val), k = normPkg(row.pkg);
    if(v){
      const hits = db.parts.filter(p=> normValue(p.val)===v && (!k || normPkg(p.pkg)===k));
      if(hits.length === 1) return {p:hits[0], how: k ? "value + package" : "value"};
      if(hits.length > 1){
        /* Several parts answer to this value. With a package given they are
           the same component from different makers and the first will do.
           Without one they are not: a bin holding 1kΩ in 0402, 0603, 0805
           and 1206 would hand back whichever was entered first, and the file
           would go to the fab carrying that part number and that footprint.
           Refusing is the only honest answer - say so and let it be fixed. */
        if(k) return {p:hits[0], how:"value + package"};
        return {p:null, how:"", why:"the line gives no footprint and "+hits.length+
                " parts share that value: "+[...new Set(hits.map(p=>p.pkg||"?"))].join(", ")};
      }
    }
  }
  return {p:null, how:""};
}

/* boards buildable from stock, for a saved BOM, without touching ui state */
function bomCapacity(text){
  const rows = parseBom(text);
  if(!rows.length) return {n:0, lines:0, missing:0, short:0};
  let n = Infinity, missing = 0, short = 0;
  rows.forEach(r=>{
    const m = matchBom(r);
    const per = r.need || 1;
    if(!m.p){ missing++; n = 0; return; }
    const can = Math.floor(Number(m.p.qty||0)/per);
    if(can < 1) short++;
    if(can < n) n = can;
  });
  return {n: isFinite(n)?n:0, lines: rows.length, missing, short};
}

function runBom(){
  const boards = Math.max(1, Number(ui.bomQty)||1);
  ui.bomRows = parseBom(ui.bomText).map(r=>{
    const m = matchBom(r);
    const need  = r.need * boards;
    const have  = m.p ? Number(m.p.qty||0) : 0;
    return Object.assign({}, r, {need, have, short: Math.max(0, need-have),
                                 part:m.p, how:m.how, why:m.why||"",
                                 state: !m.p ? "missing" : (have>=need ? "ok" : "short")});
  });
}

/* Decide every line against the shelf again without re-reading the text.
   The part numbers fetched from LCSC, and the ones typed in by hand, live on
   the rows and nowhere else - re-parsing would throw all of them away, which
   is not what changing how a line is matched should cost. The quantity is
   already multiplied out by the board count, so it is left alone.         */
function rematchBom(){
  if(!ui.bomRows) return;
  ui.bomRows = ui.bomRows.map(r=>{
    const m = matchBom(r);
    const have = m.p ? Number(m.p.qty||0) : 0;
    return Object.assign({}, r, {have, short: Math.max(0, r.need-have),
                                 part:m.p, how:m.how, why:m.why||"",
                                 state: !m.p ? "missing" : (have>=r.need ? "ok" : "short")});
  });
}

/* ------------------------------------------------- a BOM a fab will take --
   PCBWay asks for the line number, quantity, reference designator, part
   number, description, package and mounting type, and for a turn-key order
   also the manufacturer and the distributor's code. NextPCB asks for the
   designator, quantity, description, footprint, manufacturer and part
   number. The same facts either way, under different headings - so each gets
   a file with the headings it asks for rather than one that half-suits both.
   Both take CSV.                                                            */
/* four digits is an imperial or metric chip size; three is a size that lost
   its leading zero, and padPkg has already fixed the ones that are real, so
   whatever is still three digits is not something to guess about          */
const SMD_PKG = /^\d{4}$|SOT|SOD|SOP|QFN|QFP|SOIC|MSOP|TSSOP|DFN|BGA|LGA|SMD|CHIP|WSON|UDFN|CSP|^SM[ABC]$|MELF/i;
const THT_PKG = /^(DIP|RADIAL|AXIAL|THT|SIP|ZIP|HEADER)|PLUGIN|THROUGH.?HOLE/i;

/* an SMD part called through-hole is a scrapped panel, so anything the
   package does not say outright is left for a human to answer. The TO and DO
   families have to be read by their number, not their prefix: TO-220 is
   through-hole and TO-252 is not, DO-41 is through-hole and DO-214 is not. */
function bomMount(pkg){
  const p = String(pkg||"").trim();
  if(!p) return "";
  if(/^TO-?(25[12]|26[1348]|236|243)/i.test(p)) return "SMD";
  if(/^TO-?(3|18|39|92|126|220|221|247|264)/i.test(p)) return "THT";
  if(/^DO-?21[345]/i.test(p)) return "SMD";
  if(/^DO-?(15|27|34|35|41|20[14])/i.test(p)) return "THT";
  if(THT_PKG.test(p)) return "THT";
  if(SMD_PKG.test(p)) return "SMD";
  return "";
}

/* what the line knows, filled out from the part it matched on the shelf */
function bomOut(r){
  const p = r.part || {};
  return {ref:  r.ref || "",
          qty:  r.need || 0,
          mpn:  r.mpn || p.mpn || "",
          mfr:  r.mfr || p.mfr || "",
          val:  r.val || p.val || "",
          /* the houses that have no Value column still want it said somewhere */
          desc: r.desc || p.desc || r.val || p.val || "",
          pkg:  padPkg(r.pkg || p.pkg),
          lcsc: (r.lcsc || p.lcsc || "").toUpperCase()};
}

/* the page a fab can buy the part from, which PCBGOGO asks for by name */
const lcscLink = code => code ? "https://www.lcsc.com/product-detail/"+encodeURIComponent(code)+".html" : "";

/* Headings copied from each house's own template, not from a description of
   it: NextPCB marks its required columns with a star and PCBGOGO leads with
   the quantity, and both are reproduced exactly as their sheets have them. */
const BOM_FORMS = {
  pcbway: {name:"PCBWay",
    head:["Item","Quantity","Reference Designator","Manufacturer Part Number","Manufacturer",
          "Description","Package","Type","Distributor Part Number"],
    row:(o,i)=>[i+1, o.qty, o.ref, o.mpn, o.mfr, o.desc, o.pkg, bomMount(o.pkg), o.lcsc]},
  nextpcb: {name:"NextPCB",
    head:["Designator*","Quantity*","Manufacturer Part Number*","Manufacturer","Package/Footprint",
          "Description","Procurement Type","Customer Note"],
    row:o=>[o.ref, o.qty, o.mpn, o.mfr, o.pkg, o.desc, "", o.lcsc]},
  /* JLCPCB is the odd one out and the easiest to satisfy: it asks for three
     columns and matches the part from its own library by the LCSC code, which
     is the one number every part in this bin already carries. Comment is
     descriptive only - the code is what actually selects the part.        */
  jlcpcb: {name:"JLCPCB",
    head:["Comment","Designator","Footprint","LCSC Part #"],
    row:o=>[o.val || o.mpn || o.desc, o.ref, o.pkg, o.lcsc]},
  pcbgogo: {name:"PCBGOGO",
    head:["Quantity","Designator","Description","Value","Footprint","Manufacturer","Part Number",
          "Buying Link as reference"],
    row:o=>[o.qty, o.ref, o.desc, o.val, o.pkg, o.mfr, o.mpn, lcscLink(o.lcsc)]}
};

/* the header row and every line under it, as a plain grid */
function bomSheet(vendor){
  const form = BOM_FORMS[vendor] || BOM_FORMS.pcbway;
  const rows = (ui.bomRows||[]).map(bomOut);
  return [form.head].concat(rows.map((o,i)=>form.row(o,i)));
}
function bomXlsx(vendor){ return xlsxBlob("BOM", bomSheet(vendor)); }

/* lines carrying only a supplier code: a fab cannot source from one, so the
   manufacturer's number is read off LCSC and written onto the line          */
function bomGaps(){
  return (ui.bomRows||[]).filter(r=> lcscCode(r.lcsc) &&
    !String(r.mpn||"").trim() && !(r.part && String(r.part.mpn||"").trim()));
}
let bomFillStop = false;

async function bomFillMpn(){
  const list = bomGaps();
  bomFillStop = false;
  let done = 0, filled = 0;
  const failed = [];
  for(const r of list){
    if(bomFillStop) break;
    const w = $("#bomWork");
    if(w) w.innerHTML = `<div class="lcscnote" style="margin-top:10px">Reading <b>${done+1}</b> of ${list.length}${
        failed.length?` · ${failed.length} could not be read`:""}…</div>
      <div class="sheetbar"><button class="btn ghost" id="bomFillHalt">Stop</button></div>`;
    try{
      const got = lcscMap(await lcscFetch(lcscCode(r.lcsc)));
      if(got.mpn){ r.mpn = got.mpn; filled++; }
      if(got.mfr && !r.mfr)   r.mfr = got.mfr;
      if(got.pkg && !r.pkg)   r.pkg = padPkg(got.pkg);
      if(got.desc && !r.desc) r.desc = got.desc;
      /* the value is what makes an equivalent on the shelf findable later */
      if(got.val && !r.val)   r.val = got.val;
    }catch(e){ failed.push(r.lcsc); }
    done++;
    if(done < list.length && !bomFillStop) await new Promise(res=>setTimeout(res,250));
  }
  render();
  const w = $("#bomWork");
  if(w) w.innerHTML = `<div class="lcscnote" style="margin-top:10px">Read ${done} of ${list.length}${
    bomFillStop?" before stopping":""} — <b>${filled} part numbers filled in</b>${
    failed.length?` · <span class="bad">${failed.length} could not be read: ${esc(failed.slice(0,6).join(", "))}</span>`:""}.</div>`;
}

/* --------------------------------------------------------------- ordering -
   Everything worth buying: the shortfalls of the last BOM run, plus anything
   at or below its own alert level.                                          */
function buildOrder(){
  const rows = new Map();
  const add = (key, o)=>{
    const e = rows.get(key);
    if(e){ e.qty += o.qty; if(o.why && e.why.indexOf(o.why)<0) e.why += " + "+o.why; }
    else rows.set(key, o);
  };
  (ui.bomRows||[]).filter(r=>r.short>0).forEach(r=>{
    const key = (r.part && r.part.id) || ("bom:"+(r.mpn||r.lcsc||r.val));
    add(key, {lcsc:(r.part&&r.part.lcsc)||r.lcsc||"", mpn:(r.part&&r.part.mpn)||r.mpn||r.val||"",
              cat:(r.part&&r.part.cat)||"", qty:r.short, why:"BOM"});
  });
  db.parts.filter(isLow).forEach(p=>{
    /* top the shelf back up to twice the alert level, at least 10 pieces */
    const target = Math.max(minOf(p)*2, 10);
    const q = Math.max(1, Math.ceil(target - Number(p.qty||0)));
    add(p.id, {lcsc:p.lcsc||"", mpn:p.mpn||"", cat:p.cat, qty:q, why:"low stock"});
  });
  return [...rows.values()].sort((a,b)=> a.why.localeCompare(b.why) || (a.cat||"").localeCompare(b.cat||""));
}

/* --------------------------------------------------- filling in the value --
   Only a passive has a "value". An MCU description reading "64 KB Flash,
   72 MHz" would happily yield 72, so the categories are matched by what they
   are, not by whether the field happens to be empty.                        */
const VALUE_KINDS = [
  {re:/resistor|potentiom|trimpot|rheostat/i, unit:"Ω",
   pick:/(\d+(?:[.,]\d+)?\s*[kKmMrR]?)\s*(?:Ω|ohms?\b)/, alt:/\b(\d+(?:[.,]\d+)?[kKmM])\b/},
  {re:/capacitor|mlcc|tantalum|electrolytic/i, unit:"F",
   pick:/(\d+(?:[.,]\d+)?\s*[pnuµm]?)F\b/i},
  {re:/inductor|choke|coil/i, unit:"H",
   pick:/(\d+(?:[.,]\d+)?\s*[pnuµm]?)H\b/i},
  {re:/ferrite|bead/i, unit:"Ω",
   pick:/(\d+(?:[.,]\d+)?\s*[kKmM]?)\s*Ω\s*@/},
  {re:/zener/i, unit:"V", pick:/(\d+(?:[.,]\d+)?)\s*V\b/},
  {re:/crystal|resonator|oscillator/i, unit:"Hz",
   pick:/(\d+(?:[.,]\d+)?\s*[kKmM]?)Hz\b/i}
];
function valueKindFor(p){
  const hay = (p.cat||"")+" "+(p.desc||"");
  return VALUE_KINDS.find(k=>k.re.test(hay)) || null;
}
/* what the description says this part is worth, or "" when it does not say */
function guessValue(p){
  const kind = valueKindFor(p);
  if(!kind) return "";
  const src = (p.desc||"") + " " + (p.mpn||"");
  let m = kind.pick.exec(src);
  if(!m && kind.alt) m = kind.alt.exec(src);
  if(!m) return "";
  const raw = m[1].replace(/\s+/g,"").replace(",",".");
  const txt = raw + (kind.unit==="Ω" ? "Ω" : kind.unit);
  /* refuse anything the normaliser cannot read back */
  const n = parseFloat(normValue(txt));
  if(!isFinite(n) || n<=0) return "";
  return txt;
}
function guessValueList(){
  return db.parts.filter(p=>!String(p.val||"").trim())
                 .map(p=>({p, val:guessValue(p)}))
                 .filter(x=>x.val);
}

/* ------------------------------------------------------------ LCSC lookup --
   LCSC answers a part code with the maker, the package, every parameter and a
   datasheet, as plain JSON. What it does not answer with is an
   Access-Control-Allow-Origin header, and without that header no browser will
   hand the reply to a page living at a different address. Nothing written here
   can change that - the request has to be repeated by a relay that does send
   the header. Set your own under Data; the public ones are a fallback only,
   they are run by strangers as a favour and any of them may be down today.  */
/* how this page is being used, not what is in the bin - so it stays in the
   browser and never travels into the inventory file                        */
const PREF_KEY = "parts-bin-prefs-v1";
/* how a BOM line is allowed to find its part - see matchBom */
const prefs = {bomMatch:"value"};
function prefsLoad(){ try{ const t=localStorage.getItem(PREF_KEY); if(t) Object.assign(prefs, JSON.parse(t)); }catch(e){} }
function prefsSave(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }catch(e){} }

const LCSC_KEY = "parts-bin-lcsc-v1";
const LCSC_API = "https://wmsc.lcsc.com/ftps/wm/product/detail?productCode=";
/* Named so a failure can say which one failed. Ordered by what actually
   answered when this was last checked - the first is a reader service that
   sends the header properly and wraps the page in an envelope, the other two
   hand the page back untouched and are up rather less of the time.         */
/* The third flag marks a relay that runs the page's JavaScript before
   answering. It makes no difference to the part endpoint, which is plain
   JSON, but the search page is built in the browser: a relay that only
   forwards bytes hands back an empty shell with no results in it.         */
const LCSC_PUBLIC = [["reader", "https://r.jina.ai/", true],
                     ["codetabs", "https://api.codetabs.com/v1/proxy?quest={url}", false],
                     ["allorigins", "https://api.allorigins.win/raw?url={url}", false]];
let lcscVia = "";           /* which route answered last, for the Data panel */
/* The hosted demo carries a relay of its own, because a first visit that
   fails is a first visit lost - and the free public ones hand back a
   truncated page often enough to lose several. It applies to that one
   address and nowhere else: a copy downloaded and opened, or a fork hosted
   somewhere else, uses the public relays like everybody, because nobody's
   lookups should quietly run through an account that is not theirs. Setting
   your own under Data overrides it either way.                            */
const DEMO_HOST  = "abdullahjalloul.github.io";
const DEMO_RELAY = "https://lcsc-relay.abdullah-md-jalloul.workers.dev/?url={url}";
const onDemo   = () => location.hostname === DEMO_HOST;
const demoRelay = () => (onDemo() && !lcsc.relay) ? DEMO_RELAY : "";

const lcsc = {relay:"", auto:true, public:true};
function lcscLoad(){ try{ const t=localStorage.getItem(LCSC_KEY); if(t) Object.assign(lcsc, JSON.parse(t)); }catch(e){} }
function lcscSave(){ try{ localStorage.setItem(LCSC_KEY, JSON.stringify(lcsc)); }catch(e){} }

/* C1779, c1779, plain 1779, or the code lifted out of a pasted lcsc.com link.
   The C has to start a word, or "CL21A475KAQNNNE" pasted into the wrong box
   would quietly become some other real part.                                */
function lcscCode(raw){
  const s = String(raw||"").toUpperCase().trim();
  const m = s.match(/(?:^|[^A-Z0-9])C(\d{2,})(?![0-9])/);
  if(m) return "C"+m[1];
  return /^\d{2,}$/.test(s) ? "C"+s : "";
}
function lcscPage(code){ return "https://www.lcsc.com/search?q="+encodeURIComponent(code); }

/* A relay is either a template carrying {url}, or a bare prefix. A prefix that
   ends in = or ? is handed the address encoded, anything else is handed it
   whole - both shapes are in the wild and neither can be guessed from the
   other.                                                                    */
function lcscRoute(tpl, target){
  if(!tpl) return target;
  if(tpl.indexOf("{url}")>=0) return tpl.replace("{url}", encodeURIComponent(target));
  return /[=?]$/.test(tpl) ? tpl + encodeURIComponent(target) : tpl + target;
}

/* Not every relay hands the page back untouched. A reader service wraps it in
   an envelope of its own and puts the page in a string; another prints a few
   header lines before it. Dig until something with a productCode in it turns
   up, and give up after a few layers rather than chase a loop.             */
function lcscUnwrap(text, depth){
  if((depth||0) > 3) throw new Error("the reply was not a part");
  let d = null;
  try{ d = JSON.parse(text); }catch(e){}
  if(d && typeof d==="object"){
    /* LCSC's own answer, whether it found the part or not */
    if(d.result !== undefined) return d;
    const inner = (d.data && typeof d.data.content==="string") ? d.data.content
                : (typeof d.contents==="string") ? d.contents
                : (typeof d.content==="string") ? d.content : "";
    if(inner) return lcscUnwrap(inner, (depth||0)+1);
    return d;
  }
  /* not JSON at the top: a relay may have printed a preamble first */
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if(a>=0 && b>a) return lcscUnwrap(text.slice(a, b+1), (depth||0)+1);
  throw new Error("the reply was not JSON");
}

async function lcscOne(tpl, code, ms){
  const ctl = new AbortController();
  /* a relay that is alive answers in about a second; one that has not spoken
     in eight is down, and waiting longer only delays trying the next        */
  const timer = setTimeout(()=>ctl.abort(), ms||8000);
  try{
    const r = await fetch(lcscRoute(tpl, LCSC_API+code), {signal:ctl.signal, headers:{Accept:"application/json"}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return lcscUnwrap(await r.text(), 0);
  } finally { clearTimeout(timer); }
}

/* Straight at LCSC first - it costs one failed request and it is the only
   route that works when this page is already served from behind something
   that relays for it. Then yours, then the public ones. A reply saying the
   code does not exist is a real answer and stops the walk; a route that
   simply could not be reached does not.                                     */
async function lcscFetch(code){
  const routes = [["direct",""]]
    .concat(lcsc.relay?[["your relay", lcsc.relay]]:[])
    .concat(demoRelay()?[["the demo relay", demoRelay()]]:[])
    .concat(lcsc.public?LCSC_PUBLIC:[]);
  const failed = [];
  lcscVia = "";
  for(const [name,tpl] of routes){
    let d;
    try{ d = await lcscOne(tpl, code); }
    catch(e){
      failed.push(name+" "+(e.name==="AbortError" ? "timed out"
                          : /failed to fetch|networkerror|load failed/i.test(e.message) ? "could not be reached"
                          : e.message));
      continue;
    }
    if(d && d.result && d.result.productCode){ lcscVia = name; return d.result; }
    /* a real answer from LCSC saying the code is not one of theirs - no other
       route is going to say anything different, so stop here                */
    if(d && (d.code===404 || d.result===null)) throw new Error("LCSC has no part called "+code);
    failed.push(name+" answered, but not with a part");
  }
  throw new Error(failed.length ? "no route worked — "+failed.join("; ")
                                : "there is nothing to try: no relay of your own, and the public ones are switched off");
}

/* Only a passive carries a value, and the order of the pieces is this bin's
   own: a capacitor reads "25V 4.7uF X5R ±10%", not LCSC's own running order.
   Anything else - an MCU, a regulator, a MOSFET - is left with no value at
   all, exactly as the rest of the app already treats it.                    */
const LCSC_VALUE = [
  {re:/resistor/i,                     keys:[/^resistance/i]},
  {re:/capacitor/i,                    keys:[/^voltage rating/i,/^capacitance/i,/^temperature coefficient/i,/^tolerance/i]},
  {re:/inductor|choke|coil/i,          keys:[/^current rating/i,/^inductance/i,/^tolerance/i,/^dc resistance/i]},
  {re:/ferrite|bead/i,                 keys:[/impedance/i]},
  {re:/zener/i,                        keys:[/zener.*volt|volt.*zener|breakdown/i]},
  {re:/crystal|resonator|oscillator/i, keys:[/^frequency$/i]}
];
function lcscParam(r, re){
  const list = Array.isArray(r.paramVOList) ? r.paramVOList : [];
  const hit = list.find(p=>re.test(String(p.paramNameEn||"")));
  if(!hit) return "";
  const v = String(hit.paramValueEn || hit.paramValue || "").trim();
  /* LCSC leaves a few values untranslated, and Chinese on a bin label helps
     nobody here - drop those rather than write them in                      */
  return /[一-鿿]/.test(v) ? "" : v;
}
function lcscValue(r){
  const hay = (r.catalogName||"")+" "+(r.parentCatalogName||"");
  const fam = LCSC_VALUE.find(f=>f.re.test(hay));
  if(!fam) return "";
  return fam.keys.map(k=>lcscParam(r,k)).filter(Boolean).join(" ");
}

/* LCSC's catalogue tree is not this bin's shelf, so a name is only ever
   matched onto a category that already exists here. A category is never
   invented from a lookup - that is the one thing the person filling the form
   is better at than any table.                                              */
const LCSC_CATS = [
  [/microcontroller/i,                "MCU"],
  [/capacitor/i,                      "Capacitors"],
  [/resistor/i,                       "Resistors"],
  [/potentiometer|trimmer|rheostat/i, "Potentiometers"],
  [/ferrite bead/i,                   "Ferrite-Beads"],
  [/inductor|choke/i,                 "Inductors"],
  [/zener/i,                          "Zener"],
  [/\btvs\b|\besd\b|transient volt/i, "TVS ESD"],
  [/light emitting|\bled\b/i,         "LED"],
  [/bridge rectifier|rectifier/i,     "Rectifiers"],
  [/schottky|switching diode|diode/i, "Diodes"],
  [/crystal|resonator/i,              "Crystals"],
  [/optocoupler|opto-isolator|photocoupler/i, "Optocouplers"],
  [/gate driver/i,                    "MOSFET Gate Drive"],
  [/motor driver/i,                   "Motor Driver ICs"],
  [/\bldo\b|low dropout/i,            "LDO"],
  [/voltage reference/i,              "Voltage References"],
  [/comparator/i,                     "Comparators"],
  [/operational amplifier|\bop.?amp/i,"Op-Amp"],
  [/analog switch|multiplexer/i,      "Analog Switches"],
  [/varistor/i,                       "Varistors"],
  [/\bfuse\b|resettable/i,            "Fuses"],
  [/relay/i,                          "Relays"],
  [/buzzer/i,                         "Buzzer"],
  [/transformer/i,                    "Transformer"],
  [/battery holder/i,                 "BATTERY HOLDER"],
  [/\busb\b/i,                        "USB"],
  [/\bcan\b/i,                        "CAN-IC"],
  [/terminal|header|connector/i,      "Terminal"],
  [/switch|tactile/i,                 "Switches"],
  [/sensor/i,                         "Sensors"]
];
function lcscCategory(r){
  const hay = [r.catalogName, r.parentCatalogName, r.productIntroEn].filter(Boolean).join(" ");
  const has = n => db.categories.find(c=>c.trim().toLowerCase()===n.toLowerCase()) || "";
  /* the channel and the polarity are in the description, never in the tree */
  if(/mosfet|field.effect|\bfet\b/i.test(hay)){
    if(/p-?channel/i.test(hay)) return has("MOSFET P-CH");
    if(/n-?channel/i.test(hay)) return has("MOSFET N-CH");
  }
  if(/\bnpn\b/i.test(hay)) return has("BJT NPN");
  if(/\bpnp\b/i.test(hay)) return has("BJT PNP");
  for(const [re,name] of LCSC_CATS){ if(re.test(hay)){ const c = has(name); if(c) return c; } }
  /* nothing named outright: fall back to whichever shelf shares the most
     words, and to none at all when it shares nothing                        */
  const words = new Set((hay.toLowerCase().match(/[a-z]{4,}/g)||[]).map(w=>w.replace(/s$/,"")));
  let best = "", score = 0;
  for(const c of db.categories){
    let n = 0;
    for(const w of (c.toLowerCase().match(/[a-z]{4,}/g)||[])) if(words.has(w.replace(/s$/,""))) n++;
    if(n>score){ score = n; best = c; }
  }
  return score ? best : "";
}

function lcscMap(r){
  return {mpn:  String(r.productModel||"").trim(),
          mfr:  String(r.brandNameEn||"").trim(),
          pkg:  String(r.encapStandard||"").trim(),
          val:  lcscValue(r),
          desc: String(r.productIntroEn||r.productDescEn||"").trim().replace(/\s+RoHS$/i,""),
          cat:  lcscCategory(r),
          src:  "LCSC"};
}
/* -------------------------------------------- filling many parts at once --
   Every part that carries an LCSC code but has a field left blank can be read
   in one pass. The rule is the one the single lookup uses - a blank is filled,
   anything already written is never touched - and it runs in two steps like
   the other bulk actions here: read first, see what it proposes, then apply.

   A part with no value is not on its own a reason to go back to LCSC: an MCU
   or a MOSFET has no value and never will, so asking again every time would
   burn a request per part forever. Only the fields LCSC always answers with
   decide whether a part is worth asking about.                              */
const LCSC_GAP_KEYS  = ["mpn","mfr","pkg","desc","cat"];
const LCSC_FILL_KEYS = ["mpn","mfr","pkg","val","desc","cat","src"];
function lcscGapList(){
  return db.parts.filter(p => lcscCode(p.lcsc) &&
    LCSC_GAP_KEYS.some(k => !String(p[k]||"").trim()));
}
let lcscBulkStop = false;

async function lcscBulkRead(){
  const list = lcscGapList();
  lcscBulkStop = false;
  ui.lcscBulk = null;
  const rows = [], failed = [];
  let done = 0;
  for(const p of list){
    if(lcscBulkStop) break;
    lcscBulkProgress(done, list.length, failed.length);
    try{
      const got = lcscMap(await lcscFetch(lcscCode(p.lcsc)));
      const fills = {};
      for(const k of LCSC_FILL_KEYS){
        const v = got[k];
        if(!v || String(p[k]||"").trim()) continue;
        /* a shelf is never invented for a part behind the person's back */
        if(k==="cat" && !db.categories.includes(v)) continue;
        fills[k] = v;
      }
      if(Object.keys(fills).length) rows.push({p, fills});
    }catch(e){ failed.push({p, why:e.message}); }
    done++;
    /* a free relay is doing this as a favour - do not hammer it */
    if(done < list.length && !lcscBulkStop) await new Promise(r=>setTimeout(r,250));
  }
  ui.lcscBulk = {rows, failed, done, total:list.length, stopped:lcscBulkStop};
  lcscBulkShow();
}

function lcscBulkProgress(done, total, failed){
  const w = $("#lcscBulkWork");
  if(!w) return;                       /* the view was left mid-run */
  w.innerHTML = `<div class="lcscnote" style="margin-top:10px">
      Reading <b>${done+1}</b> of ${total}${failed?` · ${failed} could not be read`:""}…
    </div>
    <div class="sheetbar"><button class="btn ghost" id="lcscBulkHalt">Stop</button></div>`;
}

function lcscBulkShow(){
  const b = ui.lcscBulk, w = $("#lcscBulkWork");
  if(!w || !b) return;
  if(!b.rows.length){
    w.innerHTML = `<div class="lcscnote" style="margin-top:10px">Read ${b.done} of ${b.total}${
      b.stopped?" before stopping":""} — nothing new came back${
      b.failed.length?`, and ${b.failed.length} could not be read`:""}.</div>
      <div class="sheetbar"><button class="btn ghost" id="lcscBulkCancel">Close</button></div>`;
    return;
  }
  const fieldName = {mpn:"part number", mfr:"manufacturer", pkg:"package", val:"value",
                     desc:"description", cat:"category", src:"supplier"};
  w.innerHTML = `<table style="margin-top:12px"><thead><tr><th>LCSC</th><th>Part</th>
      <th>Would fill</th></tr></thead><tbody>
      ${b.rows.slice(0,60).map(r=>`<tr>
        <td class="m">${esc(r.p.lcsc)}</td>
        <td class="m">${esc(r.p.mpn||r.p.val||"—")}</td>
        <td style="font-size:11.5px">${Object.keys(r.fills).map(k=>
          `<span style="color:var(--ink3)">${esc(fieldName[k]||k)}</span>
           <b style="color:var(--kapton)">${esc(String(r.fills[k]).slice(0,42))}</b>`).join(" · ")}</td></tr>`).join("")}
      ${b.rows.length>60?`<tr><td colspan="3" style="color:var(--ink3)">…and ${b.rows.length-60} more</td></tr>`:""}
     </tbody></table>
     <div class="lcscnote" style="margin-top:8px">Read ${b.done} of ${b.total}${b.stopped?" before stopping":""}${
       b.failed.length?` · <span class="bad">${b.failed.length} could not be read</span>`:""}.</div>
     <div class="sheetbar"><button class="btn" id="lcscBulkApply">Fill in ${b.rows.length} parts</button>
       <button class="btn ghost" id="lcscBulkCancel">Cancel</button></div>`;
}

function lcscBulkApply(){
  const b = ui.lcscBulk;
  if(!b || !b.rows.length) return;
  /* remember only the fields actually about to change, so Undo puts back
     exactly that and nothing else                                          */
  const before = b.rows.map(r=>({p:r.p,
    was:Object.fromEntries(Object.keys(r.fills).map(k=>[k, r.p[k]]))}));
  const n = b.rows.length;
  b.rows.forEach(r=>Object.assign(r.p, r.fills));
  logAdd({k:"edit", mpn:"("+n+" parts)", cat:"filled from LCSC"});
  ui.lcscBulk = null;
  save(); render();
  toast("Filled "+n+" parts from LCSC", "Undo", ()=>{
    before.forEach(x=>Object.assign(x.p, x.was));
    save(); render();
  });
}

/* ------------------------------------------ finding a code from a part no -
   Plenty of parts were entered with only a manufacturer part number. LCSC's
   own search API sits behind a bot filter and answers 403 to anything that is
   not their website, but the reader relay renders the search page, and the
   codes are in the product-detail links on it.

   That is a guess and must be treated as one. LCSC answers a part number it
   does not carry with near neighbours, or with the whole category - searching
   0603SAF8204T5E returns 0603WAF8204T5E, which is a different tolerance and
   the wrong part to write into a bin. So every candidate is looked up
   properly through the detail endpoint and its real part number compared with
   the one asked for. Nothing is ever filled in from the guess alone.       */
const LCSC_SEARCH = "https://www.lcsc.com/search?q=";
const mpnKey = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");

/* the same walk as lcscFetch, but for any address, and it hands back text.
   `routes` is passed in because the search needs the rendering relays only -
   going straight at LCSC returns the page's empty shell, and returns it fast,
   which would look like success and find nothing.                          */
async function lcscTextFrom(url, ms, routes){
  routes = routes || [["direct",""]]
    .concat(lcsc.relay?[["your relay", lcsc.relay]]:[])
    .concat(demoRelay()?[["the demo relay", demoRelay()]]:[])
    .concat(lcsc.public?LCSC_PUBLIC:[]);
  const failed = [];
  for(const [name,tpl] of routes){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), ms||25000);
    try{
      const r = await fetch(lcscRoute(tpl, url), {signal:ctl.signal, headers:{Accept:"application/json"}});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const body = await r.text();
      /* a reader relay wraps the page; anything else hands it over as it is */
      let d = null; try{ d = JSON.parse(body); }catch(e){}
      if(d && d.data && typeof d.data.content==="string") return d.data.content;
      if(d && typeof d.contents==="string") return d.contents;
      return body;
    }catch(e){
      failed.push(name+" "+(e.name==="AbortError" ? "timed out" : e.message));
    } finally { clearTimeout(timer); }
  }
  throw new Error("no route worked — "+failed.join("; "));
}

/* JLCPCB search the same catalogue from the other end, and they find part
   numbers LCSC's own search box denies exist: 0402WGF1002TCE comes back as
   C25744 here and as nothing at all there. It answers structured JSON rather
   than a page that has to be rendered and read, so it is both quicker and
   surer - but it is a POST, and a relay has to be willing to forward one.
   The public relays are not; a Worker of your own is.                     */
const JLC_SEARCH = "https://jlcpcb.com/api/overseas-pcb-order/v1/shoppingCart/smtGood/selectSmtComponentList";
async function lcscFindJlc(mpn, ms){
  const relay = lcsc.relay || demoRelay();
  if(!relay) return null;
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms||12000);
  try{
    const r = await fetch(lcscRoute(relay, JLC_SEARCH), {
      method:"POST", signal:ctl.signal,
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({keyword:mpn, currentPage:1, pageSize:8})
    });
    if(!r.ok) return null;
    const d = JSON.parse(await r.text());
    const list = d && d.data && d.data.componentPageInfo && d.data.componentPageInfo.list;
    if(!Array.isArray(list)) return null;
    const codes = [];
    for(const it of list){
      const c = lcscCode(it.componentCode || "");
      if(c && codes.indexOf(c) < 0) codes.push(c);
      if(codes.length >= 4) break;
    }
    return codes.length ? codes : null;
  }catch(e){ return null; }
  finally{ clearTimeout(timer); }
}

async function lcscFind(mpn){
  /* the better source first, when there is a relay that can reach it */
  let codes = await lcscFindJlc(mpn);

  if(!codes){
    const renderers = (lcsc.public?LCSC_PUBLIC:[]).filter(r=>r[2]);
    if(!renderers.length)
      throw new Error("searching by part number needs either a relay of your own or one of the built-in ones, and neither is available");
    const text = await lcscTextFrom(LCSC_SEARCH+encodeURIComponent(mpn), 30000, renderers);
    /* "0 results" is LCSC's search talking, and it is not to be believed: it
       answers 0402WGF1002TCE with nothing at all, while the part sits in the
       catalogue as C25744. Say what happened and let the person judge.     */
    if(/\b0 results\b/i.test(text) && !/product-detail\/C\d+\.html/.test(text))
      throw new Error("LCSC's own search found nothing for "+mpn+" — which it also does for parts it stocks, so this is not proof it has none");
    codes = [];
    const rx = /product-detail\/(C\d+)\.html/g;
    let m;
    while((m = rx.exec(text)) !== null && codes.length < 4)
      if(codes.indexOf(m[1])<0) codes.push(m[1]);
    if(!codes.length) throw new Error("nothing on that page looked like a part");
  }

  /* whichever found them, every candidate is read back and its real part
     number compared - JLCPCB return near neighbours too, answering
     SRN4018-220M with NRSE4018-220M, which is not the same part          */
  const want = mpnKey(mpn), out = [];
  for(const c of codes){
    try{
      const r = await lcscFetch(c);
      out.push({code:c, r, exact: mpnKey(r.productModel)===want});
    }catch(e){}
  }
  if(!out.length) throw new Error("the codes on that page could not be read back");
  out.sort((a,b)=>(b.exact?1:0)-(a.exact?1:0));
  return out;
}

function lcscPrice(r){
  const l = Array.isArray(r.productPriceList) ? r.productPriceList : [];
  if(!l.length) return "";
  const first = l[0];
  const sym = first.currencySymbol || r.currencySymbol || "$";
  const p = Number(first.usdPrice != null ? first.usdPrice : first.productPrice);
  return isFinite(p) ? sym + p.toFixed(4).replace(/0+$/,"").replace(/\.$/,"") + " each" : "";
}

/* ---------------------------------------------------------- calculators ---
   Engineering notation in and out. Input is case sensitive on purpose, the
   way a schematic is: M is mega, m is milli. A letter may also stand in for
   the decimal point, so 4k7 is 4700 and 1R2 is 1.2.                        */
const SI_IN = {p:1e-12, n:1e-9, u:1e-6, "\u00b5":1e-6, m:1e-3, R:1, r:1, E:1,
               k:1e3, K:1e3, M:1e6, G:1e9, T:1e12};
/* Units a field may be labelled with, longest first, so "\u00b0C/W" is taken off
   before "\u00b0C" and "mm\u00b2" before "mm". Stripped only from the end: a unit in
   the middle of a number is not a unit.

   A bare trailing m is deliberately absent. It is milli far more often than
   it is metres, and the hint under the boxes says so; taking it as a unit
   would quietly turn 100m into a tenth of what was meant.                 */
const UNIT_TAIL = /(?:\u00b0C\/W|mm\u00b2|\u00b0C|Hz|Ah|Wh|VA|oz|mm)$/;
/* `unit` is the label on the field being read, and it settles the one case
