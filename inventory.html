/* ---------------------------------------------------------------- actions */
function toast(msg, undoLabel, undoFn){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>` + (undoFn?`<button class="undo">${esc(undoLabel)}</button>`:"");
  t.hidden = false;
  if(undoFn) t.querySelector(".undo").onclick = ()=>{ t.hidden=true; undoFn(); };
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.hidden=true; }, undoFn?8000:2600);
}
function findPart(id){ return db.parts.find(p=>p.id===Number(id)); }

function logAdd(entry){
  db.log = db.log||[];
  db.log.push(Object.assign({t:new Date().toISOString(), dev:device}, entry));
  if(db.log.length>2000) db.log = db.log.slice(-2000);
}

function bump(p, d){
  const before = Number(p.qty||0);
  const after  = Math.max(0, before + d);
  if(after===before) return;
  p.qty = after;
  logAdd({k:"qty", id:p.id, mpn:p.mpn, lcsc:p.lcsc, cat:p.cat, d:after-before, a:before, b:after});
  save(); render();
}

/* `seed` pre-fills a blank form - the free drawer on the wall uses it to hand
   over the box number it is standing for, and "add another" hands back the
   box and the shelf so a whole drawer can be filled without stopping.       */
function openEditor(p, seed){
  const isNew = !p;
  const s = seed || {};
  const d = p || {id:0,cat:s.cat||ui.cat||db.categories[0],lcsc:"",mpn:"",val:"",pkg:"",qty:0,min:null,
                  box:s.box||ui.box||"",desc:"",src:""};
  $("#overlay").hidden = false;
  $("#overlay").innerHTML = `<form class="sheet" id="sheet" data-new="${isNew?1:0}" data-opencat="${esc(d.cat||"")}">
    <h2>${isNew?"Add part":"Edit part"}</h2>
    <div class="form">
      <div class="f wide"><label class="lab">Manufacturer part number</label>
        <div class="lcscrow"><input name="mpn" value="${esc(d.mpn)}" required>
          <button class="btn ghost" type="button" id="lcscFind"
                  title="Search LCSC for this part number and find its code">Find code</button></div></div>
      <div class="f"><label class="lab">LCSC</label>
        <div class="lcscrow"><input name="lcsc" value="${esc(d.lcsc)}" placeholder="C1779">
          <button class="btn ghost" type="button" id="lcscGet" title="Read the rest of this part off LCSC">Fetch</button></div>
        <small>${d.lcsc?`<a class="linkish" target="_blank" rel="noreferrer" href="https://www.lcsc.com/search?q=${encodeURIComponent(d.lcsc)}">open on lcsc.com</a>`:"&nbsp;"}</small></div>
      <div class="f"><label class="lab">Supplier</label><input name="src" value="${esc(d.src)}" placeholder="LCSC"></div>
      <div class="lcscnote" id="lcscNote"></div>
      <div class="f"><label class="lab">Value or type</label><input name="val" value="${esc(d.val)}" placeholder="10kΩ"></div>
      <div class="f"><label class="lab">Package</label><input name="pkg" value="${esc(d.pkg)}" placeholder="0603"></div>
      <div class="f"><label class="lab">Manufacturer</label><input name="mfr" value="${esc(d.mfr||"")}" placeholder="Murata" list="mfrList">
        <datalist id="mfrList">${mfrList().map(m=>`<option value="${esc(m.name)}">`).join("")}</datalist></div>
      <div class="f"><label class="lab">Category</label><select name="cat" id="catSel">${db.categories.map(c=>`<option${c===d.cat?" selected":""}>${esc(c)}</option>`).join("")}<option value="__new">+ new category…</option></select></div>
      <div class="f" id="newCatWrap" hidden><label class="lab">Name the new category</label><input name="newcat" id="newCatInput" placeholder="Current Sense"></div>
      <div class="f"><label class="lab">Box</label><input name="box" value="${esc(d.box)}" placeholder="C7 or C1:25 + C6:20"><small>free numbers: ${nextFree().map(g=>g.next).join(", ")}</small></div>
      <div class="f"><label class="lab">Quantity</label><input name="qty" type="number" step="1" min="0" value="${Number(d.qty||0)}"></div>
      <div class="f"><label class="lab">Alert below</label><input name="min" type="number" step="1" min="0" value="${d.min==null?"":d.min}" placeholder="2"><small>empty = 2</small></div>
      <div class="f wide"><label class="lab">Description</label><input name="desc" value="${esc(d.desc)}"></div>
    </div>
    <div class="sheetbar">
      <button class="btn" type="submit">${isNew?"Add part":"Save changes"}</button>
      ${isNew?`<button class="btn ghost" type="submit" id="addMore"
                 title="keep the box and the category, clear the rest">Save and add another</button>`:""}
      <button class="btn ghost" type="button" id="cancel">Cancel</button>
      <span class="grow"></span>
      ${isNew?"":`<button class="btn ghost danger" type="button" id="del">Delete part</button>`}
    </div></form>`;
  $("#sheet").addEventListener("submit", ev=>{
    ev.preventDefault();
    const f = new FormData(ev.target);
    const get = k => String(f.get(k)||"").trim();
    let cat = get("cat");
    if(cat==="__new"){
      cat = get("newcat");
      if(!cat){ toast("Type a name for the new category"); $("#newCatInput").focus(); return; }
      if(!db.categories.includes(cat)) db.categories.push(cat);
    }
    const rec = {cat:cat, lcsc:get("lcsc").toUpperCase(), mpn:get("mpn"), val:get("val"),
                 pkg:padPkg(get("pkg")), mfr:get("mfr"), box:get("box").toUpperCase(), desc:get("desc"), src:get("src"),
                 qty:Number(f.get("qty")||0), min:get("min")===""?null:Number(f.get("min"))};
    if(isNew){
      rec.id = 1+db.parts.reduce((m,p)=>Math.max(m,p.id),0);
      db.parts.push(rec);
      logAdd({k:"add", id:rec.id, mpn:rec.mpn, lcsc:rec.lcsc, cat:rec.cat, b:rec.qty});
    } else {
      const before = Number(p.qty||0);
      Object.assign(p, rec);
      logAdd({k:"edit", id:p.id, mpn:p.mpn, lcsc:p.lcsc, cat:p.cat,
              d:Number(rec.qty)-before, a:before, b:Number(rec.qty)});
    }
    save(); render();
    /* which button sent it - asking the event beats a flag, which would still
       be set from a first press the browser refused over an empty part number */
    const again = !!(ev.submitter && ev.submitter.id==="addMore");
    if(isNew && again){
      /* straight back into an empty form on the same shelf, in the same box */
      openEditor(null, {box:rec.box, cat:rec.cat});
      const key = (partBoxes(rec)[0]||{}).key || "";
      const n = key ? (boxStats().find(b=>b.key===key)||{items:0}).items : 0;
      toast(key ? "Added — box "+key+" now holds "+n : "Part added");
      return;
    }
    closeEditor(); toast(isNew?"Part added":"Saved");
  });
  $("#cancel").onclick = closeEditor;
  const del = $("#del");
  if(del) del.onclick = ()=>{
    const at = db.parts.indexOf(p);
    db.parts = db.parts.filter(x=>x.id!==p.id);
    logAdd({k:"del", id:p.id, mpn:p.mpn, lcsc:p.lcsc, cat:p.cat, a:Number(p.qty||0)});
    closeEditor(); save(); render();
    toast("Deleted "+(p.mpn||p.lcsc||"part"), "Undo", ()=>{
      db.parts.splice(Math.min(at, db.parts.length), 0, p); save(); render();
    });
  };
  /* the lookup: a button, the Enter key, and - unless it is switched off -
     simply leaving the field once the code has changed                      */
  const lc = $("#sheet [name=lcsc]");
  $("#lcscGet").onclick = ()=>lcscFill();
  lc.addEventListener("keydown", ev=>{
    if(ev.key==="Enter"){ ev.preventDefault(); lcscFill(); }
  });
  lc.addEventListener("change", ()=>{
    const code = lcscCode(lc.value);
    if(lcsc.auto && code && code!==lc.dataset.done) lcscFill();
  });
  $("#lcscFind").onclick = ()=>lcscFindFill();
  $("#lcscNote").addEventListener("click", ev=>{
    /* a candidate from a part-number search: take its code, then fill as usual */
    const pick = ev.target.closest("[data-pick]");
    if(pick){
      const hit = (ui.lcscFinds||[]).find(x=>x.code===pick.dataset.pick);
      if(!hit) return;
      const form = $("#sheet"), lc = form.elements.lcsc;
      lc.value = hit.code; lc.dataset.done = hit.code; lc.classList.add("fresh");
      lcscApply(hit.r, form, $("#lcscNote"));
      return;
    }
    const b = ev.target.closest(".take");
    if(!b) return;
    const el = $("#sheet").elements[b.dataset.k];
    if(el){ el.value = b.dataset.v; el.classList.add("fresh"); }
    b.classList.add("gone"); b.disabled = true;
  });

  const first = $("#sheet input"); if(first) first.focus();
}
function closeEditor(){ $("#overlay").hidden = true; $("#overlay").innerHTML=""; }

/* --------------------------------------------------- the lookup in action --
   An empty field is filled outright. A field already carrying something is
   never overwritten - what LCSC says is offered underneath instead, one click
   per field, because a bin's own wording for a value is usually the wording
   its owner wants to keep.                                                  */
const LCSC_FIELDS = [["mpn","part number"],["mfr","manufacturer"],["pkg","package"],
                     ["val","value"],["desc","description"],["cat","category"],["src","supplier"]];

async function lcscFill(){
  const form = $("#sheet"); if(!form) return;
  const lc = form.elements.lcsc, note = $("#lcscNote"), btn = $("#lcscGet");
  const code = lcscCode(lc.value);
  if(!code){ note.innerHTML = `<span class="bad">An LCSC code looks like C1779.</span>`; return; }
  lc.value = code;
  note.innerHTML = "Asking LCSC about "+esc(code)+"…";
  btn.disabled = true;
  try{
    const r = await lcscFetch(code);
    lc.dataset.done = code;
    lcscApply(r, form, note);
  }catch(e){
    lc.dataset.done = "";
    note.innerHTML = `<span class="bad">${esc(e.message)}.</span> ` +
      `<a class="linkish" target="_blank" rel="noreferrer" href="${esc(lcscPage(code))}">Look ${esc(code)} up by hand</a>` +
      `, or set a relay under <b>Data → Filling a part in from LCSC</b>.`;
  } finally { btn.disabled = false; }
}

/* Searching by part number takes seconds, not the fraction the code lookup
   takes, and it can come back with something that merely resembles the part.
   So it never writes: it lists what it found, says plainly which ones carry
   the part number asked for and which do not, and waits to be told.        */
async function lcscFindFill(){
  const form = $("#sheet"); if(!form) return;
  const mpn = String(form.elements.mpn.value||"").trim();
  const note = $("#lcscNote"), btn = $("#lcscFind");
  if(!mpn){ note.innerHTML = `<span class="bad">Type a manufacturer part number first.</span>`; return; }
  if(lcscCode(form.elements.lcsc.value)){
    note.innerHTML = `This part already has an LCSC code — press <b>Fetch</b> beside it instead, which is quicker and exact.`;
    return;
  }
  note.innerHTML = `Searching LCSC for <b>${esc(mpn)}</b>… this takes a few seconds.`;
  btn.disabled = true;
  try{
    const finds = await lcscFind(mpn);
    ui.lcscFinds = finds;
    const exact = finds.filter(f=>f.exact), other = finds.filter(f=>!f.exact);
    const row = f => `<button type="button" class="take" data-pick="${esc(f.code)}">
        <b>${esc(f.code)}</b> <em>${esc(f.r.productModel||"")}</em>
        ${esc([f.r.brandNameEn, f.r.encapStandard].filter(Boolean).join(" · "))}</button>`;
    let html = "";
    if(exact.length) html += `<b>Same part number:</b><br>${exact.map(row).join("")}`;
    if(other.length) html += `${exact.length?"<br>":""}<span class="bad">Different part number — check before taking:</span><br>${other.map(row).join("")}`;
    html += `<br><span style="color:var(--ink3)">Nothing has been written. Choosing one fills the code in, then fills the blanks the usual way.</span>`;
    note.innerHTML = html;
  }catch(e){
    note.innerHTML = `<span class="bad">${esc(e.message)}.</span><br>` +
      `<a class="linkish" target="_blank" rel="noreferrer" href="${esc(LCSC_SEARCH)}${encodeURIComponent(mpn)}">Search lcsc.com by hand</a>` +
      ` — and if you find it, put the code in the LCSC field and press <b>Fetch</b>, which never misses.`;
  } finally { btn.disabled = false; }
}

function lcscApply(r, form, note){
  const got = lcscMap(r);
  const filled = [], offer = [];
  for(const [k,label] of LCSC_FIELDS){
    const v = got[k], el = form.elements[k];
    if(!v || !el) continue;
    if(k==="cat"){
      /* the dropdown only carries shelves this bin already has, and an edit
         to an existing part never has its shelf moved from under it         */
      if(el.value===v) continue;
      if(form.dataset.new==="1" && el.value===form.dataset.opencat){
        el.value = v; el.classList.add("fresh"); filled.push(label);
      } else offer.push([k,label,v]);
      continue;
    }
    const cur = String(el.value||"").trim();
    if(!cur){ el.value = v; el.classList.add("fresh"); filled.push(label); }
    else if(cur.toLowerCase()!==v.toLowerCase()) offer.push([k,label,v]);
  }

  const bits = [];
  if(r.stockNumber!=null) bits.push(num(r.stockNumber)+" in stock");
  const price = lcscPrice(r); if(price) bits.push(price);
  if(r.minBuyNumber>1) bits.push("sold from "+num(r.minBuyNumber));

  let html = filled.length ? `<b>Filled ${esc(filled.join(", "))}.</b> ` : `<b>Nothing was empty to fill.</b> `;
  html += esc(bits.join(" · "));
  if(r.pdfUrl) html += ` · <a class="linkish" target="_blank" rel="noreferrer" href="${esc(r.pdfUrl)}">datasheet</a>`;
  html += ` · <a class="linkish" target="_blank" rel="noreferrer" href="${esc(lcscPage(r.productCode))}">on lcsc.com</a>`;
  if(offer.length){
    html += `<br>LCSC says otherwise — click to take it:<br>` +
      offer.map(([k,label,v])=>`<button type="button" class="take" data-k="${esc(k)}" data-v="${esc(v)}"><em>${esc(label)}</em> ${esc(v)}</button>`).join("");
  }
  note.innerHTML = html;
}

function download(name, data, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data],{type:type}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* --------------------------------------------------- writing a spreadsheet -
   Every fab takes CSV, so this looked unnecessary until you watch what Excel
   does when the fab opens it: 0402 is read as a number and comes out 402, the
   very thing that was just put right on the way in. A cell in a real sheet
   can be marked as text and the zero stays.

   An .xlsx is a zip of XML files. Nothing here needs compressing, and a zip
   that stores rather than deflates is short enough to write by hand - which
   keeps the promise that this page carries no dependencies.               */
let CRC_TBL = null;
function crc32(bytes){
  if(!CRC_TBL){
    CRC_TBL = new Uint32Array(256);
    for(let i=0;i<256;i++){
      let c = i;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
      CRC_TBL[i] = c>>>0;
    }
  }
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC_TBL[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

function zipStore(files){
  const enc = new TextEncoder();
  const u16 = n => [n&255, (n>>>8)&255];
  const u32 = n => [n&255, (n>>>8)&255, (n>>>16)&255, (n>>>24)&255];
  /* A DOS stamp of zero means day 0 of month 0, which is not a date. Some
     readers shrug; a strict one refuses the whole archive, and the upload
     comes back as a system error with nothing said about why.            */
  const d = new Date();
  const time = ((d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1)) & 0xFFFF;
  const date = (((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFFFF;
  const parts = [], dir = [];
  let at = 0;
  for(const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const local = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
      ...u16(time), ...u16(date), ...u32(crc), ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0)]);
    parts.push(local, name, data);
    dir.push({name, crc, size:data.length, at});
    at += local.length + name.length + data.length;
  }
  const central = [];
  let cdLen = 0;
  for(const e of dir){
    const h = new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
      ...u16(time), ...u16(date), ...u32(e.crc), ...u32(e.size), ...u32(e.size),
      ...u16(e.name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(e.at)]);
    central.push(h, e.name);
    cdLen += h.length + e.name.length;
  }
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(dir.length), ...u16(dir.length), ...u32(cdLen), ...u32(at), ...u16(0)]);
  return new Blob(parts.concat(central, [end]),
    {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

const xmlEsc = s => String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
function colName(n){ let s=""; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }

/* rows: an array of arrays. A finite number is written as a number; anything
   else goes in as text, which is what keeps 0402 from becoming 402.

   Written the long way on purpose. A sheet with nothing but sheetData opens
   in Excel and passes a zip check, and is still refused by the parsers a
   board house runs: they want the shared string table rather than strings
   inlined, they expect a stylesheet to exist, and several read the declared
   dimension before the rows. NextPCB answered such a file with an unexplained
   system error. So the parts every reader looks for are all present.      */
function xlsxBlob(sheetName, rows){
  const P = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";

  /* one entry per distinct string, cells point at it by index */
  const strings = [], seen = new Map();
  const strIdx = s => {
    if(seen.has(s)) return seen.get(s);
    const i = strings.length; strings.push(s); seen.set(s, i); return i;
  };
  let cellCount = 0, wide = 0;
  const sheet = rows.map((cells,r)=>{
    if(cells.length > wide) wide = cells.length;
    const cs = cells.map((v,c)=>{
      const ref = colName(c)+(r+1);
      if(typeof v === "number" && isFinite(v)){ cellCount++; return `<c r="${ref}"><v>${v}</v></c>`; }
      const s = String(v==null?"":v);
      if(!s) return `<c r="${ref}"/>`;
      cellCount++;
      return `<c r="${ref}" t="s"><v>${strIdx(s)}</v></c>`;
    }).join("");
    return `<row r="${r+1}" spans="1:${cells.length||1}">${cs}</row>`;
  }).join("");
  const dim = "A1:" + colName(Math.max(0, wide-1)) + Math.max(1, rows.length);
  const stamp = new Date().toISOString().replace(/\.\d+Z$/,"Z");

  return zipStore([
    {name:"[Content_Types].xml", text:P+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`+
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`+
      `<Default Extension="xml" ContentType="application/xml"/>`+
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`+
      `<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`+
      `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`+
      `<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>`+
      `<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>`+
      `<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`},

    {name:"_rels/.rels", text:P+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
      `<Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/>`+
      `<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>`+
      `<Relationship Id="rId3" Type="${REL}/extended-properties" Target="docProps/app.xml"/></Relationships>`},

    {name:"docProps/core.xml", text:P+`<cp:coreProperties `+
      `xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" `+
      `xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" `+
      `xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">`+
      `<dc:title>${xmlEsc(sheetName)}</dc:title><dc:creator>Parts Bin</dc:creator>`+
      `<cp:lastModifiedBy>Parts Bin</cp:lastModifiedBy>`+
      `<dcterms:created xsi:type="dcterms:W3CDTF">${stamp}</dcterms:created>`+
      `<dcterms:modified xsi:type="dcterms:W3CDTF">${stamp}</dcterms:modified></cp:coreProperties>`},

    {name:"docProps/app.xml", text:P+`<Properties `+
      `xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" `+
      `xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">`+
      `<Application>Parts Bin</Application></Properties>`},

    {name:"xl/workbook.xml", text:P+`<workbook xmlns="${NS}" xmlns:r="${REL}">`+
      `<workbookPr/><bookViews><workbookView xWindow="0" yWindow="0" windowWidth="16384" windowHeight="8192"/></bookViews>`+
      `<sheets><sheet name="${xmlEsc(sheetName).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`},

    {name:"xl/_rels/workbook.xml.rels", text:P+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
      `<Relationship Id="rId1" Type="${REL}/worksheet" Target="worksheets/sheet1.xml"/>`+
      `<Relationship Id="rId2" Type="${REL}/styles" Target="styles.xml"/>`+
      `<Relationship Id="rId3" Type="${REL}/sharedStrings" Target="sharedStrings.xml"/></Relationships>`},

    /* the smallest stylesheet Excel calls valid: the first two fills and the
       one cellXfs entry are required even when nothing is styled           */
    {name:"xl/styles.xml", text:P+`<styleSheet xmlns="${NS}">`+
      `<fonts count="1"><font><sz val="11"/><color theme="1"/><name val="Calibri"/><family val="2"/></font></fonts>`+
      `<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>`+
      `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>`+
      `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`+
      `<cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>`+
      `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>`+
      `</styleSheet>`},

    {name:"xl/sharedStrings.xml", text:P+`<sst xmlns="${NS}" count="${cellCount}" uniqueCount="${strings.length}">`+
      strings.map(s=>`<si><t xml:space="preserve">${xmlEsc(s)}</t></si>`).join("")+`</sst>`},

    {name:"xl/worksheets/sheet1.xml", text:P+`<worksheet xmlns="${NS}" xmlns:r="${REL}">`+
      `<dimension ref="${dim}"/>`+
      `<sheetViews><sheetView tabSelected="1" workbookViewId="0"/></sheetViews>`+
      `<sheetFormatPr defaultRowHeight="15"/>`+
      `<sheetData>${sheet}</sheetData></worksheet>`}
  ]);
}
function toCsv(){
  const cols = ["cat","mfr","lcsc","mpn","val","pkg","qty","min","box","desc","src"];
  const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  return [cols.join(",")].concat(db.parts.map(p=>cols.map(c=>q(p[c])).join(","))).join("\r\n");
}

/* ------------------------------------------------------------------ wiring */
document.addEventListener("click", async ev=>{
  const t = ev.target;

  /* the dashed drawer at the end of the wall is not a filter - it is an empty
     box waiting to be started, so it opens the form with its number already in */
  const nb = t.closest("[data-newbox]");
  if(nb){ openEditor(null, {box:nb.dataset.newbox}); return; }

  const drawer = t.closest("[data-box]");
  if(drawer){ ui.box = ui.box===drawer.dataset.box ? "" : drawer.dataset.box;
              if(ui.view!=="parts") ui.view="parts";
              render(); return; }

  const cat = t.closest("[data-cat]");
  if(cat){ ui.cat = ui.cat===cat.dataset.cat ? "" : cat.dataset.cat; render(); return; }

  const view = t.closest("#views button");
  if(view){ ui.view = view.dataset.view; render(); return; }

  const cl = t.closest("[data-clear]");
  if(cl){ const k = cl.dataset.clear; ui[k] = (k==="low") ? false : ""; render(); return; }

  if(t.id==="clearFilters"){ ui.cat=""; ui.box=""; ui.low=false; ui.mfr=""; render(); return; }

  const act = t.closest("[data-act]");
  if(act){
    const p = findPart(act.closest(".row").dataset.id);
    if(!p) return;
    if(act.dataset.act==="dec") bump(p,-1);
    else if(act.dataset.act==="inc") bump(p,1);
    else openEditor(p);
    return;
  }

  const mtag = t.closest("[data-mfr]");
  if(mtag){
    ui.mfr = ui.mfr===mtag.dataset.mfr ? "" : mtag.dataset.mfr;
    if(ui.view!=="parts") ui.view="parts";
    render(); return;
  }

  const row = t.closest(".row");
  if(row){ const p = findPart(row.dataset.id); if(p){ openEditor(p); return; } }

  const ck = t.closest("[data-calc]");
  if(ck){ ui.calc = ck.dataset.calc; ui.view = "calc"; render(); return; }
  const fq = t.closest("[data-findq]");
  if(fq){
    ui.q = fq.dataset.findq; ui.cat=""; ui.box=""; ui.mfr=""; ui.low=false;
    ui.view = "parts"; render();
    const box = $("#q"); if(box) box.value = ui.q;
    return;
  }
  if(t.id==="calcClear"){ ui.calcVals[ui.calc] = {}; render(); return; }

  const goto_ = t.closest("[data-view-go]");
  if(goto_){ ui.view = goto_.dataset.viewGo; render(); return; }

  if(t.id==="bomRun"){
    ui.bomText = $("#bomText").value;
    ui.bomQty  = Math.max(1, Number($("#bomQty").value)||1);
    runBom(); ui.order = null; render();
    return;
  }
  if(t.id==="bomClear"){ ui.bomText=""; ui.bomRows=null; render(); return; }

  if(t.id==="bomFillMpn"){ t.disabled = true; await bomFillMpn(); return; }
  if(t.id==="bomFillHalt"){ bomFillStop = true; t.disabled = true; t.textContent = "Stopping…"; return; }
  if(/^bomCsv(Jlcpcb|Pcbway|Nextpcb|Pcbgogo)$/.test(t.id||"")){
    const rows = ui.bomRows || [];
    if(!rows.length) return toast("Check a BOM against the bin first");
    const vendor = t.id.replace("bomCsv","").toLowerCase();
    const name = (ui.bomName||"bom").trim().replace(/[^\w.-]+/g,"-").replace(/^-|-$/g,"") || "bom";
    download(name+"-"+vendor+".xlsx", bomXlsx(vendor));
    const noPn = rows.filter(r=>!bomOut(r).mpn).length;
    toast(noPn ? rows.length+" lines exported — "+noPn+" still carry no part number"
               : rows.length+" lines exported");
    return;
  }

  if(t.id==="bomSave"){
    const name = ($("#bomName").value||"").trim();
    const text = $("#bomText").value;
    if(!name) return toast("Give the board a name first");
    if(!text.trim()) return toast("Paste the BOM first");
    db.boms = db.boms || [];
    const at = db.boms.findIndex(b=>b.name.toLowerCase()===name.toLowerCase());
    const rec = {id: at>=0?db.boms[at].id:Date.now(), name, text,
                 boards: Math.max(1,Number($("#bomQty").value)||1),
                 updated: new Date().toISOString()};
    if(at>=0) db.boms[at] = rec; else db.boms.push(rec);
    ui.bomName = name; ui.bomText = text;
    save(); render();
    toast(at>=0 ? "Updated "+name : "Saved "+name);
    return;
  }
  const bl = t.closest("[data-bomload]");
  if(bl){
    const b = (db.boms||[]).find(x=>x.id===Number(bl.dataset.bomload));
    if(!b) return;
    ui.bomText = b.text; ui.bomName = b.name; ui.bomQty = b.boards||1;
    runBom(); ui.order = null; render();
    return;
  }
  const bd = t.closest("[data-bomdel]");
  if(bd){
    const id = Number(bd.dataset.bomdel);
    const b = (db.boms||[]).find(x=>x.id===id);
    const at = (db.boms||[]).indexOf(b);
    db.boms = (db.boms||[]).filter(x=>x.id!==id);
    save(); render();

    const undo = [];
    list.forEach(r=>{
      if(r.part){
        undo.push({p:r.part, was:Number(r.part.qty||0)});
        r.part.qty = Number(r.part.qty||0) + r.qty;
        logAdd({k:"qty", id:r.part.id, mpn:r.part.mpn, lcsc:r.part.lcsc, cat:r.part.cat,
                d:r.qty, a:undo[undo.length-1].was, b:r.part.qty});
      } else {
        const rec = {id: 1+db.parts.reduce((m,p)=>Math.max(m,p.id),0),
                     cat: db.categories[0]||"Uncategorised", lcsc:r.lcsc.toUpperCase(), mpn:r.mpn,
                     val:"", pkg:"", mfr:"", qty:r.qty, min:null, box:"", desc:"", src:"order"};
        if(!db.categories.includes(rec.cat)) db.categories.push(rec.cat);
        db.parts.push(rec);
        undo.push({p:rec, isNew:true});
        logAdd({k:"add", id:rec.id, mpn:rec.mpn, lcsc:rec.lcsc, cat:rec.cat, b:rec.qty});

      undo.forEach(u=>{ if(u.isNew) db.parts = db.parts.filter(x=>x!==u.p); else u.p.qty = u.was; });

  if(t.id==="orderLcsc"){

  if(t.id==="doPrint"){ window.print(); return; }

  const mg = t.closest("[data-merge]");

    if(list.length<2) return;
    const snapshot = list.map(p=>({p, copy:JSON.parse(JSON.stringify(p))}));
    const keep = list[0];
    /* boxes become an explicit split so no quantity is invented or lost */
    const boxes = [];
    list.forEach(p=>{
      partBoxes(p).forEach(tk=>{
        const q = qtyInBox(p, tk.key)||0;
        const e = boxes.find(b=>b.key===tk.key);

    list.slice(1).forEach(p=>{

/* ------------------------------------------- dragging a category about ---
   The arrows are exact and reachable from a keyboard; a drag is quicker when
   a shelf has to travel past a dozen others. Both write the same list, and
   the two sort buttons handle the coarse arrangement, which is what a long
   list actually needs - nobody drags the fiftieth row to the top.          */
let catDrag = null;
const catDropMarks = ()=> $$("tr[data-catrow]").forEach(x=>
  x.classList.remove("dragging","dropabove","dropbelow"));

/* where the row would land: above the one under the cursor, or below it */
function catDropAt(ev){
  const row = ev.target.closest && ev.target.closest("tr[data-catrow]");
  if(!row || row.dataset.catrow===catDrag) return null;
  const r = row.getBoundingClientRect();
  return {row, below: ev.clientY > r.top + r.height/2};
}

document.addEventListener("dragstart", ev=>{
  const row = ev.target.closest && ev.target.closest("tr[data-catrow]");
  if(!row) return;
  catDrag = row.dataset.catrow;
  row.classList.add("dragging");
  ev.dataTransfer.effectAllowed = "move";
  /* Firefox refuses to start a drag unless the transfer carries something */
  try{ ev.dataTransfer.setData("text/plain", catDrag); }catch(e){}
});

document.addEventListener("dragover", ev=>{
  if(catDrag===null) return;
  const at = catDropAt(ev);
  if(!at) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  $$("tr[data-catrow]").forEach(x=>x.classList.remove("dropabove","dropbelow"));
  at.row.classList.add(at.below ? "dropbelow" : "dropabove");
});

document.addEventListener("drop", ev=>{
  if(catDrag===null) return;
  const at = catDropAt(ev);
  if(!at) return;
  ev.preventDefault();
  const a = db.categories, moved = catDrag;
  const from = a.indexOf(moved);
  catDrag = null; catDropMarks();
  if(from < 0) return;
  const was = a.slice();
  a.splice(from, 1);
  const to = a.indexOf(at.row.dataset.catrow);
  if(to < 0){ db.categories = was; return; }
  a.splice(at.below ? to+1 : to, 0, moved);
  if(a.join("␀")===was.join("␀")) return;   /* landed where it began */
  save(); render();
  toast(moved+" moved", "Undo", ()=>{ db.categories = was; save(); render(); });
});

document.addEventListener("dragend", ()=>{ catDrag = null; catDropMarks(); });

document.addEventListener("input", ev=>{
  if(ev.target.classList && ev.target.classList.contains("calcin")){
    const c = calcById(ui.calc);
    ui.calcVals[c.id] = ui.calcVals[c.id] || {};
    ui.calcVals[c.id][ev.target.dataset.ck] = ev.target.value;
    const out = $("#calcOut");
    if(out) out.innerHTML = calcDiagram(c) + calcOutHTML(c);
    return;
  }
  if(ev.target.id==="bomText"){ ui.bomText = ev.target.value; return; }
  if(ev.target.id==="bomName"){ ui.bomName = ev.target.value; return; }
  if(ev.target.id==="rcvText"){ ui.rcvText = ev.target.value; return; }
  if(ev.target.id==="bomQty"){  ui.bomQty  = Math.max(1, Number(ev.target.value)||1); return; }
  /* a part number typed onto a BOM line by hand - no render, keep the caret */
  if(ev.target.classList && ev.target.classList.contains("bommpn")){
    const i = Number(ev.target.dataset.i);
    if(ui.bomRows && ui.bomRows[i]) ui.bomRows[i].mpn = ev.target.value.trim();
    return;
  }
  if(ev.target.id==="lcscRelay"){ lcsc.relay = ev.target.value.trim(); lcscSave(); return; }
  const map = {ghRepo:"repo", ghPath:"path", ghBranch:"branch", ghToken:"token"};
  const k = map[ev.target.id];
  if(k){ gh[k] = ev.target.value.trim(); gh.sha = null; ghSave(); }   /* no render: keep the caret */
});

document.addEventListener("change", ev=>{
  if(ev.target.classList && ev.target.classList.contains("calcin")){
    const c = calcById(ui.calc);
    ui.calcVals[c.id] = ui.calcVals[c.id] || {};
    ui.calcVals[c.id][ev.target.dataset.ck] = ev.target.value;
    const out = $("#calcOut");
    if(out) out.innerHTML = calcDiagram(c) + calcOutHTML(c);
    return;
  }
  if(ev.target.id==="ghAuto"){
    gh.auto = ev.target.checked; ghSave(); render();
    if(gh.auto && ghReady() && !ghPulled) ghPull();
  }
  if(ev.target.id==="bomMatchMode"){
    prefs.bomMatch = ev.target.value; prefsSave();
    rematchBom();      /* re-decide, but keep what has been filled in */
    ui.order = null; render();
    return;
  }
  if(ev.target.id==="lcscAuto"){   lcsc.auto   = ev.target.checked; lcscSave(); }
  if(ev.target.id==="lcscPublic"){ lcsc.public = ev.target.checked; lcscSave(); }
  if(ev.target.id==="sort"){ ui.sort=ev.target.value; render(); }
  if(ev.target.id==="catSel"){
    const isNew = ev.target.value==="__new";
    $("#newCatWrap").hidden = !isNew;
    if(isNew) $("#newCatInput").focus();
  }
  if(ev.target.id==="importInput"){
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ try{
        const next = JSON.parse(r.result);
        if(!next || !Array.isArray(next.parts)) throw new Error("no parts array in that file");
        db = normalize(next); save(); render(); toast("Loaded "+f.name);
      }catch(e){ toast("Could not load: "+e.message); } };
    r.readAsText(f);
  }
});

$("#q").addEventListener("input", e=>{ ui.q = e.target.value; if(ui.view!=="parts") ui.view="parts"; render(); });

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="newCatField"){ e.preventDefault(); $("#catAdd").click(); return; }
  if(e.key==="Enter" && e.target.id==="catRenameField"){
    e.preventDefault(); const b=$("[data-catsave]"); if(b) b.click(); return;
  }
  if(e.key==="Escape"){
    if(!$("#overlay").hidden){ closeEditor(); return; }
    if(ui.q){ ui.q=""; $("#q").value=""; render(); }
    return;
  }
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(e.key==="/" && !typing){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
});

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="hidden") return;
  if(fileHandle){ clearTimeout(saveTimer); fileWrite(); }
  /* do not sit on an unsent change while the tab is being closed */
  if(ghPushPending){ clearTimeout(ghTimer); ghPush(true); }
});

/* -------------------------------------------------------------------- boot */
function normalize(d){
  d.parts = (d.parts||[]).map((p,i)=>({
    id: Number(p.id||i+1), cat:p.cat||"", lcsc:(p.lcsc||"").toUpperCase(), mpn:p.mpn||"",
    val:p.val||"", pkg:padPkg(p.pkg), mfr:p.mfr||"", qty:Number(p.qty||0),
    min:(p.min===null||p.min===undefined||p.min==="")?null:Number(p.min),
    box:(p.box||"").toUpperCase(), desc:p.desc||"", src:p.src||""
  }));
  const cats = new Set(d.categories||[]);
  d.parts.forEach(p=>{ if(p.cat) cats.add(p.cat); });
  d.categories = [...cats];
  d.log = Array.isArray(d.log)? d.log : [];
  d.boms = Array.isArray(d.boms) ? d.boms.map(b=>({
    id:Number(b.id||Date.now()), name:String(b.name||"board"), text:String(b.text||""),
    boards:Number(b.boards||1), updated:String(b.updated||"")
  })) : [];
  d.version = 1;
  return d;
}

(function boot(){
  try{
    devLoad();
    ghLoad();
    lcscLoad();
    prefsLoad();
    const saved = localLoad();
    db = normalize(saved && Array.isArray(saved.parts) && saved.parts.length ? saved : JSON.parse(JSON.stringify(SEED)));
    chip(saved?true:localSave());
    render();

    /* a machine with no parts must read before it can do anything useful */
    if(ghReady() && (gh.auto || !db.parts.length)) ghPull(!!db.parts.length);

    /* Reattach last session's file. The File System Access API will not
       re-grant a handle without user activation, so when the browser answers
       "prompt" we arm the very next click or key press instead of making the
       person hunt for a button.                                              */
    idbGet("fileHandle").then(async h=>{
      if(!h || !h.queryPermission) return;
      try{
        const perm = await h.queryPermission({mode:"readwrite"});
        if(perm==="granted"){ fileHandle = h; await adoptFile(); }
        else { pendingHandle = h; armReconnect(); }
        chip(); render();
      }catch(e){}
    });
  }catch(err){
    const d = document.createElement("div");
    d.className = "fatal";
    d.textContent = "The app could not start:\n" + (err && err.stack ? err.stack : err) +
                    "\n\nSend this text back and it can be fixed.";
    document.body.prepend(d);
  }
})();
</script>
